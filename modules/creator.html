<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeOS – Creator</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    /* =========================================
       CREATOR MODULE – LOCAL STYLES
       ========================================= */

    /* ----- Tab Bar ----- */
    .tab-bar {
      display: flex;
      gap: 4px;
      padding: 20px 28px 0;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab-bar::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color var(--transition), border-color var(--transition);
      font-family: inherit;
    }

    .tab-btn:hover { color: var(--text-primary); }

    .tab-btn.active {
      color: var(--creator-color);
      border-bottom-color: var(--creator-color);
    }

    /* ----- Tab Panels ----- */
    .tab-panel {
      display: none;
      padding: 24px 28px;
      animation: fadeIn 0.2s ease;
    }

    .tab-panel.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ----- Shared Inputs ----- */
    .input-field {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      width: 100%;
      outline: none;
      transition: border-color var(--transition);
    }

    .input-field:focus { border-color: var(--creator-color); }
    .input-field::placeholder { color: var(--text-muted); }

    textarea.input-field {
      resize: vertical;
      min-height: 80px;
      line-height: 1.5;
    }

    .input-select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      width: 100%;
      outline: none;
      cursor: pointer;
      transition: border-color var(--transition);
    }

    .input-select:focus { border-color: var(--creator-color); }

    /* ----- Buttons ----- */
    .btn-primary {
      background: var(--creator-color);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity var(--transition);
      white-space: nowrap;
    }

    .btn-primary:hover { opacity: 0.85; }

    .btn-danger {
      background: rgba(255,80,80,0.13);
      color: #ff5050;
      border: 1px solid rgba(255,80,80,0.28);
      padding: 5px 11px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--transition);
    }

    .btn-danger:hover { background: rgba(255,80,80,0.26); }

    .btn-cancel {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--transition);
    }

    .btn-cancel:hover { background: rgba(255,255,255,0.05); }

    /* ----- Section Header ----- */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-header h2 { font-size: 18px; font-weight: 700; }

    /* ----- Form Grid ----- */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 600;
    }

    /* ----- Modal ----- */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal h3 { font-size: 17px; font-weight: 700; }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    /* ----- Empty State ----- */
    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: 40px 0;
    }

    .empty-icon { font-size: 36px; display: block; margin-bottom: 10px; }

    /* ==========================================
       TAB 1 – VIDEO IDEAS
       ========================================== */

    /* Filter row */
    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: rgba(224, 102, 160, 0.15);
      color: var(--creator-color);
      border-color: var(--creator-color);
    }

    /* Ideas grid */
    .ideas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }

    .idea-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color var(--transition), transform var(--transition);
    }

    .idea-card:hover {
      border-color: var(--creator-color);
      transform: translateY(-2px);
    }

    .idea-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .idea-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      flex: 1;
    }

    .idea-notes {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .idea-card-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Badges */
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge-platform {
      background: rgba(224,102,160,0.13);
      color: var(--creator-color);
    }

    .badge-idea      { background: rgba(245,166,35,0.15);  color: var(--accent-amber); }
    .badge-scripting { background: rgba(79,156,249,0.15);  color: var(--accent-blue); }
    .badge-filming   { background: rgba(124,111,224,0.15); color: var(--accent-purple); }
    .badge-editing   { background: rgba(56,189,248,0.15);  color: var(--accent-teal); }
    .badge-published { background: rgba(62,207,142,0.15);  color: var(--accent-green); }

    /* Status cycling button */
    .btn-status {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
      line-height: 1;
    }

    /* ==========================================
       TAB 2 – HOOK LIBRARY
       ========================================== */

    .hook-add-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
    }

    .hook-add-row {
      display: flex;
      gap: 10px;
    }

    .hooks-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hook-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: border-color var(--transition);
    }

    .hook-card:hover { border-color: var(--creator-color); }

    .hook-body { flex: 1; }

    .hook-text {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      margin-bottom: 6px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .hook-category {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .hook-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-copy {
      background: rgba(224,102,160,0.13);
      color: var(--creator-color);
      border: 1px solid rgba(224,102,160,0.3);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--transition);
      white-space: nowrap;
    }

    .btn-copy:hover       { background: rgba(224,102,160,0.28); }
    .btn-copy.copied      { background: rgba(62,207,142,0.2); color: var(--accent-green); border-color: var(--accent-green); }

    /* ==========================================
       TAB 3 – UPLOAD TRACKER
       ========================================== */

    /* Summary bar */
    .upload-summary {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .up-stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      text-align: center;
    }

    .up-stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 5px;
    }

    .up-stat-value {
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--creator-color);
    }

    /* Add form */
    .upload-form {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 22px;
      align-items: end;
    }

    /* Upload list */
    .upload-list { display: flex; flex-direction: column; gap: 10px; }

    .upload-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      transition: border-color var(--transition);
    }

    .upload-row:hover { border-color: var(--creator-color); }

    .upload-icon { font-size: 22px; flex-shrink: 0; }

    .upload-info { flex: 1; min-width: 0; }

    .upload-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .upload-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .upload-views {
      font-size: 14px;
      font-weight: 700;
      color: var(--creator-color);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* ==========================================
       TAB 4 – EARNINGS
       ========================================== */

    .earnings-summary {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .earn-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
    }

    .earn-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
    }

    .earn-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent-green);
      font-variant-numeric: tabular-nums;
    }

    .earn-form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 22px;
      align-items: end;
    }

    .earn-list { display: flex; flex-direction: column; gap: 10px; }

    .earn-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      transition: border-color var(--transition);
    }

    .earn-row:hover { border-color: var(--accent-green); }

    .earn-icon { font-size: 22px; flex-shrink: 0; }
    .earn-info { flex: 1; min-width: 0; }
    .earn-title { font-size: 14px; font-weight: 600; }
    .earn-meta  { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .earn-amount {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-green);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* ==========================================
       RESPONSIVE
       ========================================== */

    @media (max-width: 700px) {
      .upload-form { grid-template-columns: 1fr 1fr; }
      .upload-form .btn-primary { grid-column: 1/-1; }
      .earn-form   { grid-template-columns: 1fr 1fr; }
      .earn-form .btn-primary   { grid-column: 1/-1; }
    }

    @media (max-width: 480px) {
      .tab-bar   { padding: 14px 16px 0; }
      .tab-panel { padding: 18px 16px; }
      .ideas-grid { grid-template-columns: 1fr; }
      .upload-form { grid-template-columns: 1fr; }
      .earn-form   { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">LifeOS</span>
    </div>
    <nav class="sidebar-nav">
      <a href="../index.html"     class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></a>
      <a href="school.html"       class="nav-item"><span class="nav-icon">🎓</span><span class="nav-label">School</span></a>
      <a href="productivity.html" class="nav-item"><span class="nav-icon">✅</span><span class="nav-label">Productivity</span></a>
      <a href="notes.html"        class="nav-item"><span class="nav-icon">📝</span><span class="nav-label">Notes</span></a>
      <a href="finance.html"      class="nav-item"><span class="nav-icon">💰</span><span class="nav-label">Finance</span></a>
      <a href="creator.html"      class="nav-item active"><span class="nav-icon">🎬</span><span class="nav-label">Creator</span></a>
    </nav>
    <div class="sidebar-footer"><span>LifeOS v1.0</span></div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main-content">

    <header class="topbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">☰</button>
      <div class="topbar-title">🎬 Content Creator</div>
      <div class="topbar-date" id="currentDate"></div>
    </header>

    <!-- Tab Bar -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="ideas">Video Ideas</button>
      <button class="tab-btn"        data-tab="hooks">Hook Library</button>
      <button class="tab-btn"        data-tab="uploads">Upload Tracker</button>
      <button class="tab-btn"        data-tab="earnings">Earnings</button>
    </div>

    <!-- ==========================================
         TAB 1 – VIDEO IDEAS
         ========================================== -->
    <div class="tab-panel active" id="tab-ideas">

      <div class="section-header">
        <h2>Video Ideas</h2>
        <button class="btn-primary" id="openIdeaModal">+ New Idea</button>
      </div>

      <!-- Status filter -->
      <div class="filter-row" id="ideaFilters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="idea">💡 Idea</button>
        <button class="filter-btn" data-filter="scripting">📝 Scripting</button>
        <button class="filter-btn" data-filter="filming">🎥 Filming</button>
        <button class="filter-btn" data-filter="editing">✂️ Editing</button>
        <button class="filter-btn" data-filter="published">✅ Published</button>
      </div>

      <div class="ideas-grid" id="ideasGrid"></div>
    </div>

    <!-- ==========================================
         TAB 2 – HOOK LIBRARY
         ========================================== -->
    <div class="tab-panel" id="tab-hooks">

      <div class="section-header">
        <h2>Viral Hook Library</h2>
      </div>

      <!-- Add hook form -->
      <div class="hook-add-form">
        <div class="form-group">
          <label class="form-label">Hook Text</label>
          <textarea class="input-field" id="hookText"
            placeholder="e.g. "I made ₱100K in 30 days doing this one thing…""></textarea>
        </div>
        <div class="hook-add-row">
          <div class="form-group" style="flex:1">
            <label class="form-label">Category</label>
            <select class="input-select" id="hookCategory">
              <option value="Curiosity">Curiosity</option>
              <option value="Controversy">Controversy</option>
              <option value="Listicle">Listicle</option>
              <option value="Story">Story</option>
              <option value="How-To">How-To</option>
              <option value="Challenge">Challenge</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group" style="justify-content:flex-end">
            <label class="form-label">&nbsp;</label>
            <button class="btn-primary" id="addHookBtn">+ Save Hook</button>
          </div>
        </div>
      </div>

      <div class="hooks-list" id="hooksList"></div>
    </div>

    <!-- ==========================================
         TAB 3 – UPLOAD TRACKER
         ========================================== -->
    <div class="tab-panel" id="tab-uploads">

      <!-- Summary stats -->
      <div class="upload-summary">
        <div class="up-stat">
          <div class="up-stat-label">Total Uploads</div>
          <div class="up-stat-value" id="totalUploads">0</div>
        </div>
        <div class="up-stat">
          <div class="up-stat-label">Total Views</div>
          <div class="up-stat-value" id="totalViews">0</div>
        </div>
        <div class="up-stat">
          <div class="up-stat-label">This Month</div>
          <div class="up-stat-value" id="monthUploads">0</div>
        </div>
      </div>

      <!-- Add upload form -->
      <div class="upload-form">
        <div class="form-group">
          <label class="form-label">Video Title</label>
          <input type="text" class="input-field" id="uploadTitle" placeholder="e.g. My Morning Routine" maxlength="80" />
        </div>
        <div class="form-group">
          <label class="form-label">Platform</label>
          <select class="input-select" id="uploadPlatform">
            <option value="YouTube">▶ YouTube</option>
            <option value="TikTok">🎵 TikTok</option>
            <option value="Instagram">📸 Instagram</option>
            <option value="Facebook">👍 Facebook</option>
            <option value="Twitter/X">🐦 Twitter/X</option>
            <option value="Other">📦 Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Views</label>
          <input type="number" class="input-field" id="uploadViews" placeholder="0" min="0" />
        </div>
        <div class="form-group">
          <label class="form-label">Date Posted</label>
          <input type="date" class="input-field" id="uploadDate" />
        </div>
        <div class="form-group" style="grid-column:1/-1">
          <button class="btn-primary" style="width:100%" id="addUploadBtn">+ Log Upload</button>
        </div>
      </div>

      <div class="upload-list" id="uploadList"></div>
    </div>

    <!-- ==========================================
         TAB 4 – EARNINGS
         ========================================== -->
    <div class="tab-panel" id="tab-earnings">

      <!-- Summary -->
      <div class="earnings-summary">
        <div class="earn-card">
          <div class="earn-label">Total Earned</div>
          <div class="earn-value" id="totalEarned">₱0</div>
        </div>
        <div class="earn-card">
          <div class="earn-label">This Month</div>
          <div class="earn-value" id="monthEarned">₱0</div>
        </div>
        <div class="earn-card">
          <div class="earn-label">Top Platform</div>
          <div class="earn-value" id="topPlatform" style="font-size:16px">—</div>
        </div>
      </div>

      <!-- Add earning form -->
      <div class="earn-form">
        <div class="form-group">
          <label class="form-label">Description</label>
          <input type="text" class="input-field" id="earnDesc" placeholder="e.g. AdSense payout" maxlength="60" />
        </div>
        <div class="form-group">
          <label class="form-label">Platform</label>
          <select class="input-select" id="earnPlatform">
            <option value="YouTube">▶ YouTube</option>
            <option value="TikTok">🎵 TikTok</option>
            <option value="Instagram">📸 Instagram</option>
            <option value="Sponsorship">🤝 Sponsorship</option>
            <option value="Affiliate">🔗 Affiliate</option>
            <option value="Other">📦 Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Amount (₱)</label>
          <input type="number" class="input-field" id="earnAmount" placeholder="0.00" min="0" step="0.01" />
        </div>
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" class="input-field" id="earnDate" />
        </div>
        <div class="form-group" style="grid-column:1/-1">
          <button class="btn-primary" style="width:100%" id="addEarnBtn">+ Log Earnings</button>
        </div>
      </div>

      <div class="earn-list" id="earnList"></div>
    </div>

  </main>

  <div class="overlay" id="overlay"></div>

  <!-- ==========================================
       MODAL – New Video Idea
       ========================================== -->
  <div class="modal-backdrop" id="ideaModal">
    <div class="modal">
      <h3>💡 New Video Idea</h3>

      <div class="form-group">
        <label class="form-label">Title / Concept</label>
        <input type="text" class="input-field" id="ideaTitle" placeholder="e.g. Day in the life of a college student" maxlength="100" />
      </div>

      <div class="form-group">
        <label class="form-label">Platform</label>
        <select class="input-select" id="ideaPlatform">
          <option value="YouTube">▶ YouTube</option>
          <option value="TikTok">🎵 TikTok</option>
          <option value="Instagram">📸 Instagram</option>
          <option value="Facebook">👍 Facebook</option>
          <option value="Multi-platform">🌐 Multi-platform</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Niche / Topic</label>
        <input type="text" class="input-field" id="ideaNiche" placeholder="e.g. Lifestyle, Finance, Tech" maxlength="40" />
      </div>

      <div class="form-group">
        <label class="form-label">Notes (optional)</label>
        <textarea class="input-field" id="ideaNotes" placeholder="Hook ideas, references, key points…" style="min-height:70px"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" id="cancelIdeaModal">Cancel</button>
        <button class="btn-primary" id="saveIdeaBtn">Save Idea</button>
      </div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../firebase.js"></script>

  <script src="../app.js"></script>
  <script>
    // =========================================
    // CONTENT CREATOR MODULE – inline JS
    // =========================================

    // ----- localStorage keys -----
    const CK = {
      ideas:   'lifeos_creator_ideas',
      hooks:   'lifeos_creator_hooks',
      uploads: 'lifeos_creator_uploads',
      earn:    'lifeos_creator_earn'
    };

    // ----- Helpers -----
    async function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    async function fmtDate(iso) {
      return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric'
      });
    }

    async function fmtMoney(n) {
      return '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    async function fmtViews(n) {
      n = Number(n);
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
      if (n >= 1_000)     return (n / 1_000).toFixed(1) + 'K';
      return String(n);
    }

    async function escHtml(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function setToday(id) {
      const el = document.getElementById(id);
      if (el && !el.value) el.value = new Date().toISOString().split('T')[0];
    }

    // ----- Data -----
    const get  = async key => await lifeOSLoad(key, []);
    const save = async (key, arr) => { await lifeOSSave(key, arr); showSyncStatus('✓ Synced to cloud'); };

    // =========================================
    // TAB SWITCHING
    // =========================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    // =========================================
    // TAB 1 – VIDEO IDEAS
    // =========================================

    const STATUS_ORDER  = ['idea', 'scripting', 'filming', 'editing', 'published'];
    const STATUS_LABELS = {
      idea: '💡 Idea', scripting: '📝 Scripting',
      filming: '🎥 Filming', editing: '✂️ Editing', published: '✅ Published'
    };
    const STATUS_BADGE_CLASS = {
      idea: 'badge-idea', scripting: 'badge-scripting',
      filming: 'badge-filming', editing: 'badge-editing', published: 'badge-published'
    };

    let ideaFilter = 'all';

    async function renderIdeas() {
      const grid = document.getElementById('ideasGrid');
      let ideas  = await get(CK.ideas);

      if (ideaFilter !== 'all') ideas = ideas.filter(i => i.status === ideaFilter);

      if (ideas.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
          <span class="empty-icon">🎬</span>No ideas yet. Click "+ New Idea" to start your content pipeline!</div>`;
        return;
      }

      grid.innerHTML = [...ideas].reverse().map(i => `
        <div class="idea-card">
          <div class="idea-card-top">
            <div class="idea-title">${escHtml(i.title)}</div>
            <button class="btn-danger" onclick="deleteIdea('${i.id}')">✕</button>
          </div>
          ${i.notes ? `<div class="idea-notes">${escHtml(i.notes)}</div>` : ''}
          <div class="idea-card-footer">
            <span class="badge badge-platform">${escHtml(i.platform)}</span>
            ${i.niche ? `<span class="badge" style="background:rgba(255,255,255,0.07);color:var(--text-muted)">${escHtml(i.niche)}</span>` : ''}
            <button class="btn-status" onclick="cycleStatus('${i.id}')" title="Click to advance status">
              <span class="badge ${STATUS_BADGE_CLASS[i.status]}">${STATUS_LABELS[i.status]}</span>
            </button>
          </div>
        </div>
      `).join('');
    }

    // Advance status to next stage on click
    async function cycleStatus(id) {
      const ideas = await get(CK.ideas);
      const idea  = ideas.find(i => i.id === id);
      if (!idea) return;
      const idx    = STATUS_ORDER.indexOf(idea.status);
      idea.status  = STATUS_ORDER[(idx + 1) % STATUS_ORDER.length];
      await save(CK.ideas, ideas);
      await renderIdeas();
    }

    async function deleteIdea(id) {
      save(CK.ideas, (await get(CK.ideas)).filter(i => i.id !== id));
      await renderIdeas();
    }

    // Filter buttons
    document.querySelectorAll('#ideaFilters .filter-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        document.querySelectorAll('#ideaFilters .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        ideaFilter = btn.dataset.filter;
        await renderIdeas();
      });
    });

    // Modal
    document.getElementById('openIdeaModal').addEventListener('click', async () =>
      document.getElementById('ideaModal').classList.add('open'));

    document.getElementById('cancelIdeaModal').addEventListener('click', async () =>
      document.getElementById('ideaModal').classList.remove('open'));

    document.getElementById('ideaModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('open');
    });

    document.getElementById('saveIdeaBtn').addEventListener('click', async () => {
      const title    = document.getElementById('ideaTitle').value.trim();
      const platform = document.getElementById('ideaPlatform').value;
      const niche    = document.getElementById('ideaNiche').value.trim();
      const notes    = document.getElementById('ideaNotes').value.trim();

      if (!title) { alert('Please enter a title for your idea.'); return; }

      const ideas = await get(CK.ideas);
      ideas.push({ id: uid(), title, platform, niche, notes, status: 'idea', date: new Date().toISOString() });
      await save(CK.ideas, ideas);

      ['ideaTitle','ideaNiche','ideaNotes'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('ideaModal').classList.remove('open');
      await renderIdeas();
    });

    await renderIdeas();

    // =========================================
    // TAB 2 – HOOK LIBRARY
    // =========================================

    async function renderHooks() {
      const list  = document.getElementById('hooksList');
      const hooks = await get(CK.hooks);

      if (hooks.length === 0) {
        list.innerHTML = `<div class="empty-state">
          <span class="empty-icon">🎣</span>No hooks saved yet. Add your first viral hook formula above!</div>`;
        return;
      }

      list.innerHTML = [...hooks].reverse().map(h => `
        <div class="hook-card">
          <div class="hook-body">
            <div class="hook-text">${escHtml(h.text)}</div>
            <div class="hook-category">${escHtml(h.category)}</div>
          </div>
          <div class="hook-actions">
            <button class="btn-copy" id="copy-${h.id}" onclick="copyHook('${h.id}')">📋 Copy</button>
            <button class="btn-danger" onclick="deleteHook('${h.id}')">✕</button>
          </div>
        </div>
      `).join('');
    }

    async function copyHook(id) {
      const hook = (await get(CK.hooks)).find(h => h.id === id);
      if (!hook) return;

      navigator.clipboard.writeText(hook.text).then(() => {
        const btn = document.getElementById('copy-' + id);
        if (btn) {
          btn.textContent = '✅ Copied!';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = '📋 Copy';
            btn.classList.remove('copied');
          }, 2000);
        }
      });
    }

    async function deleteHook(id) {
      save(CK.hooks, (await get(CK.hooks)).filter(h => h.id !== id));
      await renderHooks();
    }

    document.getElementById('addHookBtn').addEventListener('click', async () => {
      const text     = document.getElementById('hookText').value.trim();
      const category = document.getElementById('hookCategory').value;

      if (!text) { alert('Please enter a hook text.'); return; }

      const hooks = await get(CK.hooks);
      hooks.push({ id: uid(), text, category, date: new Date().toISOString() });
      await save(CK.hooks, hooks);
      document.getElementById('hookText').value = '';
      await renderHooks();
    });

    await renderHooks();

    // =========================================
    // TAB 3 – UPLOAD TRACKER
    // =========================================

    setToday('uploadDate');

    const PLATFORM_ICON = {
      YouTube: '▶', TikTok: '🎵', Instagram: '📸',
      Facebook: '👍', 'Twitter/X': '🐦', Other: '📦'
    };

    async function renderUploads() {
      const list    = document.getElementById('uploadList');
      const uploads = await get(CK.uploads);

      // Update summary stats
      const now         = new Date();
      const thisMonth   = uploads.filter(u => {
        const d = new Date(u.date + 'T00:00:00');
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      });
      const totalViews  = uploads.reduce((s, u) => s + Number(u.views || 0), 0);

      document.getElementById('totalUploads').textContent = uploads.length;
      document.getElementById('totalViews').textContent   = fmtViews(totalViews);
      document.getElementById('monthUploads').textContent = thisMonth.length;

      if (uploads.length === 0) {
        list.innerHTML = `<div class="empty-state">
          <span class="empty-icon">📤</span>No uploads logged yet.</div>`;
        return;
      }

      list.innerHTML = [...uploads].reverse().map(u => `
        <div class="upload-row">
          <div class="upload-icon">${PLATFORM_ICON[u.platform] || '📦'}</div>
          <div class="upload-info">
            <div class="upload-title">${escHtml(u.title)}</div>
            <div class="upload-meta">${escHtml(u.platform)} · ${fmtDate(u.date)}</div>
          </div>
          <div class="upload-views">👁 ${fmtViews(u.views)}</div>
          <button class="btn-danger" onclick="deleteUpload('${u.id}')">✕</button>
        </div>
      `).join('');
    }

    async function deleteUpload(id) {
      const uploads = await get(CK.uploads);
      await save(CK.uploads, uploads.filter(u => u.id !== id));
      await renderUploads();
    }

    document.getElementById('addUploadBtn').addEventListener('click', async () => {
      const title    = document.getElementById('uploadTitle').value.trim();
      const platform = document.getElementById('uploadPlatform').value;
      const views    = parseInt(document.getElementById('uploadViews').value) || 0;
      const date     = document.getElementById('uploadDate').value;

      if (!title || !date) { alert('Please fill in the video title and date.'); return; }

      const uploads = await get(CK.uploads);
      uploads.push({ id: uid(), title, platform, views, date });
      await save(CK.uploads, uploads);

      document.getElementById('uploadTitle').value = '';
      document.getElementById('uploadViews').value = '';
      await renderUploads();
    });

    await renderUploads();

    // =========================================
    // TAB 4 – EARNINGS
    // =========================================

    setToday('earnDate');

    const EARN_ICON = {
      YouTube: '▶', TikTok: '🎵', Instagram: '📸',
      Sponsorship: '🤝', Affiliate: '🔗', Other: '📦'
    };

    async function renderEarnings() {
      const list     = document.getElementById('earnList');
      const earnings = await get(CK.earn);

      // Summary calculations
      const now       = new Date();
      const total     = earnings.reduce((s, e) => s + Number(e.amount), 0);
      const monthEarn = earnings
        .filter(e => {
          const d = new Date(e.date + 'T00:00:00');
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        })
        .reduce((s, e) => s + Number(e.amount), 0);

      // Top platform by total earnings
      const platformTotals = {};
      earnings.forEach(e => {
        platformTotals[e.platform] = (platformTotals[e.platform] || 0) + Number(e.amount);
      });
      const topPlatform = Object.entries(platformTotals).sort((a,b) => b[1]-a[1])[0];

      document.getElementById('totalEarned').textContent = fmtMoney(total);
      document.getElementById('monthEarned').textContent = fmtMoney(monthEarn);
      document.getElementById('topPlatform').textContent = topPlatform ? topPlatform[0] : '—';

      if (earnings.length === 0) {
        list.innerHTML = `<div class="empty-state">
          <span class="empty-icon">💸</span>No earnings logged yet.</div>`;
        return;
      }

      list.innerHTML = [...earnings].reverse().map(e => `
        <div class="earn-row">
          <div class="earn-icon">${EARN_ICON[e.platform] || '📦'}</div>
          <div class="earn-info">
            <div class="earn-title">${escHtml(e.desc)}</div>
            <div class="earn-meta">${escHtml(e.platform)} · ${fmtDate(e.date)}</div>
          </div>
          <div class="earn-amount">${fmtMoney(e.amount)}</div>
          <button class="btn-danger" onclick="deleteEarn('${e.id}')">✕</button>
        </div>
      `).join('');
    }

    async function deleteEarn(id) {
      save(CK.earn, (await get(CK.earn)).filter(e => e.id !== id));
      await renderEarnings();
    }

    document.getElementById('addEarnBtn').addEventListener('click', async () => {
      const desc     = document.getElementById('earnDesc').value.trim();
      const platform = document.getElementById('earnPlatform').value;
      const amount   = parseFloat(document.getElementById('earnAmount').value);
      const date     = document.getElementById('earnDate').value;

      if (!desc || isNaN(amount) || amount <= 0 || !date) {
        alert('Please fill in all earnings fields.');
        return;
      }

      const earnings = await get(CK.earn);
      earnings.push({ id: uid(), desc, platform, amount, date });
      await save(CK.earn, earnings);

      document.getElementById('earnDesc').value   = '';
      document.getElementById('earnAmount').value = '';
      await renderEarnings();
    });

    await renderEarnings();
  </script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../firebase.js"></script>

</body>
</html>
