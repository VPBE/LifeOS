<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeOS – Finance</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    /* =========================================
       FINANCE MODULE – LOCAL STYLES
       ========================================= */

    /* Reuse amber as the finance accent */
    --fin: var(--accent-amber);

    /* ----- Tab Bar ----- */
    .tab-bar {
      display: flex;
      gap: 6px;
      padding: 20px 28px 0;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color var(--transition), border-color var(--transition);
      font-family: inherit;
    }

    .tab-btn:hover { color: var(--text-primary); }

    .tab-btn.active {
      color: var(--accent-amber);
      border-bottom-color: var(--accent-amber);
    }

    /* ----- Tab Panels ----- */
    .tab-panel {
      display: none;
      padding: 24px 28px;
      animation: fadeIn 0.2s ease;
    }

    .tab-panel.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ----- Shared Inputs ----- */
    .input-field {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      width: 100%;
      outline: none;
      transition: border-color var(--transition);
    }

    .input-field:focus { border-color: var(--accent-amber); }
    .input-field::placeholder { color: var(--text-muted); }

    .input-select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      width: 100%;
      outline: none;
      cursor: pointer;
      transition: border-color var(--transition);
    }

    .input-select:focus { border-color: var(--accent-amber); }

    /* ----- Buttons ----- */
    .btn-primary {
      background: var(--accent-amber);
      color: #111;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity var(--transition);
      white-space: nowrap;
    }

    .btn-primary:hover { opacity: 0.85; }

    .btn-danger {
      background: rgba(255,80,80,0.15);
      color: #ff5050;
      border: 1px solid rgba(255,80,80,0.3);
      padding: 5px 11px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--transition);
    }

    .btn-danger:hover { background: rgba(255,80,80,0.28); }

    .btn-ghost {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--transition), color var(--transition);
    }

    .btn-ghost:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }

    /* ----- Section Header ----- */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    /* ----- Summary Banner ----- */
    .summary-banner {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      text-align: center;
    }

    .summary-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .summary-value {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .summary-value.income  { color: var(--accent-green); }
    .summary-value.expense { color: #ff6b6b; }
    .summary-value.balance { color: var(--accent-amber); }

    /* ----- Inline Add Form ----- */
    .add-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 10px;
      margin-bottom: 22px;
      align-items: end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 600;
    }

    /* ----- Transaction List ----- */
    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tx-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      transition: border-color var(--transition);
    }

    .tx-row:hover { border-color: var(--accent-amber); }

    .tx-icon {
      font-size: 22px;
      flex-shrink: 0;
      width: 38px;
      text-align: center;
    }

    .tx-info { flex: 1; min-width: 0; }

    .tx-source {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .tx-amount {
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .tx-amount.green { color: var(--accent-green); }
    .tx-amount.red   { color: #ff6b6b; }

    /* ----- Category Breakdown ----- */
    .breakdown-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 26px 0 12px;
    }

    .breakdown-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
    }

    .breakdown-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .breakdown-label {
      font-size: 13px;
      color: var(--text-muted);
      width: 110px;
      flex-shrink: 0;
    }

    .breakdown-bar-wrap {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
    }

    .breakdown-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--accent-amber);
      transition: width 0.5s ease;
    }

    .breakdown-pct {
      font-size: 12px;
      color: var(--text-muted);
      width: 36px;
      text-align: right;
    }

    /* ----- Savings Goals ----- */
    .goals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .goal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color var(--transition), transform var(--transition);
    }

    .goal-card:hover {
      border-color: var(--accent-amber);
      transform: translateY(-2px);
    }

    .goal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .goal-name {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
    }

    .goal-emoji { font-size: 24px; flex-shrink: 0; }

    .goal-amounts {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .goal-saved {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-amber);
      font-variant-numeric: tabular-nums;
    }

    .goal-target {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Animated progress bar */
    .goal-bar-wrap {
      background: rgba(255,255,255,0.06);
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
    }

    .goal-bar-fill {
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--accent-amber), #ffcc55);
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .goal-bar-fill.complete {
      background: linear-gradient(90deg, var(--accent-green), #6effc2);
    }

    .goal-pct {
      font-size: 12px;
      color: var(--text-muted);
      text-align: right;
    }

    .goal-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-contribute {
      flex: 1;
      background: rgba(245,166,35,0.15);
      color: var(--accent-amber);
      border: 1px solid rgba(245,166,35,0.35);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--transition);
    }

    .btn-contribute:hover { background: rgba(245,166,35,0.28); }

    /* ----- Modal ----- */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal h3 { font-size: 17px; font-weight: 700; }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .btn-cancel {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--transition);
    }

    .btn-cancel:hover { background: rgba(255,255,255,0.05); }

    /* ----- Empty State ----- */
    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: 40px 0;
    }

    .empty-icon {
      font-size: 36px;
      display: block;
      margin-bottom: 10px;
    }

    /* ----- Responsive ----- */
    @media (max-width: 700px) {
      .add-form {
        grid-template-columns: 1fr 1fr;
      }

      .add-form .btn-primary { grid-column: 1 / -1; }
    }

    @media (max-width: 480px) {
      .tab-bar   { padding: 14px 16px 0; }
      .tab-panel { padding: 18px 16px; }
      .tab-btn   { font-size: 12px; padding: 8px 10px 10px; }
      .add-form  { grid-template-columns: 1fr; }
      .goals-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">LifeOS</span>
    </div>
    <nav class="sidebar-nav">
      <a href="../index.html"     class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></a>
      <a href="school.html"       class="nav-item"><span class="nav-icon">🎓</span><span class="nav-label">School</span></a>

      <div class="topbar-date" id="currentDate"></div>

    <div class="tab-bar">
      <button class="tab-btn active" data-tab="income">Income</button>
      <button class="tab-btn"        data-tab="expenses">Expenses</button>
      <button class="tab-btn"        data-tab="goals">Savings Goals</button>
    </div>

    <!-- ==========================================
         TAB 1 – INCOME
         ========================================== -->
    <div class="tab-panel active" id="tab-income">

      <!-- Summary row -->
      <div class="summary-banner">
        <div class="summary-card">
          <div class="summary-label">Total Income</div>
          <div class="summary-value income" id="totalIncome">₱0</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Total Expenses</div>
          <div class="summary-value expense" id="totalExpenseFromIncome">₱0</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Net Balance</div>
          <div class="summary-value balance" id="netBalance">₱0</div>
        </div>
      </div>

      <!-- Add income form -->
      <div class="add-form" id="incomeForm">
        <div class="form-group">
          <label class="form-label">Source</label>
          <input type="text" class="input-field" id="incomeSource" placeholder="e.g. Freelance" maxlength="50" />
        </div>
        <div class="form-group">
          <label class="form-label">Amount (₱)</label>
          <input type="number" class="input-field" id="incomeAmount" placeholder="0.00" min="0" step="0.01" />
        </div>
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" class="input-field" id="incomeDate" />
        </div>
        <div class="form-group" style="justify-content:flex-end">
          <button class="btn-primary" id="addIncomeBtn">+ Add</button>
        </div>
      </div>

      <!-- Income list -->
      <div class="tx-list" id="incomeList"></div>

    </div>

    <!-- ==========================================
         TAB 2 – EXPENSES
         ========================================== -->
    <div class="tab-panel" id="tab-expenses">

      <!-- Add expense form -->
      <div class="add-form">
        <div class="form-group">
          <label class="form-label">Description</label>
          <input type="text" class="input-field" id="expenseDesc" placeholder="e.g. Groceries" maxlength="50" />
        </div>
        <div class="form-group">
          <label class="form-label">Amount (₱)</label>
          <input type="number" class="input-field" id="expenseAmount" placeholder="0.00" min="0" step="0.01" />
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="input-select" id="expenseCategory">
            <option value="Food">🍔 Food</option>
            <option value="Transport">🚌 Transport</option>
            <option value="School">📚 School</option>
            <option value="Shopping">🛍 Shopping</option>
            <option value="Health">💊 Health</option>
            <option value="Bills">📋 Bills</option>
            <option value="Entertainment">🎮 Entertainment</option>
            <option value="Other">📦 Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" class="input-field" id="expenseDate" />
        </div>
        <div class="form-group" style="justify-content:flex-end; grid-column: 1/-1;">
          <button class="btn-primary" id="addExpenseBtn" style="width:100%">+ Add Expense</button>
        </div>
      </div>

      <!-- Category Breakdown -->
      <div class="breakdown-title">Spending by Category</div>
      <div class="breakdown-list" id="breakdownList"></div>

      <!-- Expense list -->
      <div class="tx-list" id="expenseList"></div>

    </div>

    <!-- ==========================================
         TAB 3 – SAVINGS GOALS
         ========================================== -->
    <div class="tab-panel" id="tab-goals">

      <div class="section-header">
        <h2>Savings Goals</h2>
        <button class="btn-primary" id="openGoalModal">+ New Goal</button>
      </div>

      <div class="goals-grid" id="goalsGrid"></div>

    </div>

  </main>

  <div class="overlay" id="overlay"></div>

  <!-- ==========================================
       MODAL – New Savings Goal
       ========================================== -->
  <div class="modal-backdrop" id="goalModal">
    <div class="modal">
      <h3>🎯 New Savings Goal</h3>

      <div class="form-group">
        <label class="form-label">Goal Name</label>
        <input type="text" class="input-field" id="goalName" placeholder="e.g. New Laptop" maxlength="60" />
      </div>

      <div class="form-group">
        <label class="form-label">Target Amount (₱)</label>
        <input type="number" class="input-field" id="goalTarget" placeholder="e.g. 50000" min="1" step="1" />
      </div>

      <div class="form-group">
        <label class="form-label">Emoji Icon</label>
        <input type="text" class="input-field" id="goalEmoji" placeholder="💻" maxlength="2" />
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" id="cancelGoalModal">Cancel</button>
        <button class="btn-primary" id="saveGoalBtn">Create Goal</button>
      </div>
    </div>
  </div>

  <!-- Modal – Contribute to Goal -->
  <div class="modal-backdrop" id="contributeModal">
    <div class="modal">
      <h3 id="contributeModalTitle">Add to Goal</h3>

      <div class="form-group">
        <label class="form-label">Amount to Add (₱)</label>
        <input type="number" class="input-field" id="contributeAmount" placeholder="e.g. 500" min="1" step="1" />
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" id="cancelContributeModal">Cancel</button>
        <button class="btn-primary" id="saveContributeBtn">Add Savings</button>
      </div>
    </div>
  </div>

<script src="../firebase.js"></script>

  <script src="../app.js"></script>
  <script>
    // =========================================
    // FINANCE MODULE – inline JS
    // =========================================

    // ----- localStorage keys -----
    const FK = {
      income:   'lifeos_finance_income',    // [{id, source, amount, date}]
      expenses: 'lifeos_finance_expenses',  // [{id, desc, amount, category, date}]
      goals:    'lifeos_finance_goals'      // [{id, name, target, saved, emoji}]
    };

    // ----- Helpers -----
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    }

    function fmt(n) {
      // Format as Philippine Peso with commas
      return '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fmtDate(iso) {
      return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric'
      });
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ----- Data accessors -----
    function getIncome()   { return JSON.parse(localStorage.getItem(FK.income)   || '[]'); }
    function getExpenses() { return JSON.parse(localStorage.getItem(FK.expenses) || '[]'); }
    function getGoals()    { return JSON.parse(localStorage.getItem(FK.goals)    || '[]'); }

    function saveIncome(a)   { localStorage.setItem(FK.income,   JSON.stringify(a)); }
    function saveExpenses(a) { localStorage.setItem(FK.expenses, JSON.stringify(a)); }
    function saveGoals(a)    { localStorage.setItem(FK.goals,    JSON.stringify(a)); }

    // =========================================
    // TAB SWITCHING
    // =========================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    // =========================================
    // SHARED SUMMARY UPDATER
    // =========================================
    function updateSummary() {
      const totalInc = getIncome().reduce((s, t) => s + Number(t.amount), 0);
      const totalExp = getExpenses().reduce((s, t) => s + Number(t.amount), 0);
      const net      = totalInc - totalExp;

      document.getElementById('totalIncome').textContent            = fmt(totalInc);
      document.getElementById('totalExpenseFromIncome').textContent = fmt(totalExp);

      const netEl = document.getElementById('netBalance');
      netEl.textContent  = fmt(Math.abs(net));
      netEl.style.color  = net >= 0 ? 'var(--accent-green)' : '#ff6b6b';
    }

    // =========================================
    // SECTION 1 – INCOME
    // =========================================

    // Set today's date as default on page load
    function setTodayDate(inputId) {
      const el = document.getElementById(inputId);
      if (el && !el.value) {
        el.value = new Date().toISOString().split('T')[0];
      }
    }

    setTodayDate('incomeDate');
    setTodayDate('expenseDate');

    function renderIncome() {
      const list   = document.getElementById('incomeList');
      const income = getIncome();

      if (income.length === 0) {
        list.innerHTML = `<div class="empty-state"><span class="empty-icon">💵</span>No income logged yet.</div>`;
        return;
      }

      list.innerHTML = [...income].reverse().map(t => `
        <div class="tx-row">
          <div class="tx-icon">💵</div>
          <div class="tx-info">
            <div class="tx-source">${escHtml(t.source)}</div>
            <div class="tx-meta">${fmtDate(t.date)}</div>
          </div>
          <div class="tx-amount green">${fmt(t.amount)}</div>
          <button class="btn-danger" onclick="deleteIncome('${t.id}')">✕</button>
        </div>
      `).join('');
    }

    function deleteIncome(id) {
      saveIncome(getIncome().filter(t => t.id !== id));
      renderIncome();
      updateSummary();
    }

    document.getElementById('addIncomeBtn').addEventListener('click', () => {
      const source = document.getElementById('incomeSource').value.trim();
      const amount = parseFloat(document.getElementById('incomeAmount').value);
      const date   = document.getElementById('incomeDate').value;

      if (!source || isNaN(amount) || amount <= 0 || !date) {
        alert('Please fill in all income fields with a valid amount.');
        return;
      }

      const inc = getIncome();
      inc.push({ id: uid(), source, amount, date });
      saveIncome(inc);

      document.getElementById('incomeSource').value = '';
      document.getElementById('incomeAmount').value = '';
      renderIncome();
      updateSummary();
    });

    renderIncome();

    // =========================================
    // SECTION 2 – EXPENSES
    // =========================================

    // Emoji per category
    const CAT_ICON = {
      Food: '🍔', Transport: '🚌', School: '📚', Shopping: '🛍',
      Health: '💊', Bills: '📋', Entertainment: '🎮', Other: '📦'
    };

    function renderExpenses() {
      const list     = document.getElementById('expenseList');
      const expenses = getExpenses();

      if (expenses.length === 0) {
        list.innerHTML = `<div class="empty-state"><span class="empty-icon">🧾</span>No expenses logged yet.</div>`;
      } else {
        list.innerHTML = [...expenses].reverse().map(t => `
          <div class="tx-row">
            <div class="tx-icon">${CAT_ICON[t.category] || '📦'}</div>
            <div class="tx-info">
              <div class="tx-source">${escHtml(t.desc)}</div>
              <div class="tx-meta">${escHtml(t.category)} · ${fmtDate(t.date)}</div>
            </div>
            <div class="tx-amount red">−${fmt(t.amount)}</div>
            <button class="btn-danger" onclick="deleteExpense('${t.id}')">✕</button>
          </div>
        `).join('');
      }

      renderBreakdown(expenses);
    }

    function renderBreakdown(expenses) {
      const wrap = document.getElementById('breakdownList');

      if (expenses.length === 0) {
        wrap.innerHTML = '<div style="font-size:13px;color:var(--text-muted)">No data yet.</div>';
        return;
      }

      // Tally totals per category
      const totals = {};
      expenses.forEach(t => {
        totals[t.category] = (totals[t.category] || 0) + Number(t.amount);
      });

      const grandTotal = Object.values(totals).reduce((s, v) => s + v, 0);

      // Sort by highest spend
      const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);

      wrap.innerHTML = sorted.map(([cat, total]) => {
        const pct = grandTotal > 0 ? Math.round((total / grandTotal) * 100) : 0;
        return `
          <div class="breakdown-row">
            <div class="breakdown-label">${CAT_ICON[cat] || '📦'} ${cat}</div>
            <div class="breakdown-bar-wrap">
              <div class="breakdown-bar-fill" style="width:${pct}%"></div>
            </div>
            <div class="breakdown-pct">${pct}%</div>
          </div>
        `;
      }).join('');
    }

    function deleteExpense(id) {
      saveExpenses(getExpenses().filter(t => t.id !== id));
      renderExpenses();
      updateSummary();
    }

    document.getElementById('addExpenseBtn').addEventListener('click', () => {
      const desc     = document.getElementById('expenseDesc').value.trim();
      const amount   = parseFloat(document.getElementById('expenseAmount').value);
      const category = document.getElementById('expenseCategory').value;
      const date     = document.getElementById('expenseDate').value;

      if (!desc || isNaN(amount) || amount <= 0 || !date) {
        alert('Please fill in all expense fields with a valid amount.');
        return;
      }

      const exp = getExpenses();
      exp.push({ id: uid(), desc, amount, category, date });
      saveExpenses(exp);

      document.getElementById('expenseDesc').value   = '';
      document.getElementById('expenseAmount').value = '';
      renderExpenses();
      updateSummary();
    });

    renderExpenses();

    // =========================================
    // SECTION 3 – SAVINGS GOALS
    // =========================================

    function renderGoals() {
      const grid  = document.getElementById('goalsGrid');
      const goals = getGoals();

      if (goals.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <span class="empty-icon">🎯</span>
            No savings goals yet. Click "+ New Goal" to create one!
          </div>`;
        return;
      }

      grid.innerHTML = goals.map(g => {
        const pct      = Math.min(100, Math.round((g.saved / g.target) * 100));
        const complete = pct >= 100;
        return `
          <div class="goal-card">
            <div class="goal-header">
              <div class="goal-name">${escHtml(g.name)}</div>
              <div class="goal-emoji">${escHtml(g.emoji || '🎯')}</div>
            </div>

            <div class="goal-amounts">
              <div class="goal-saved">${fmt(g.saved)}</div>
              <div class="goal-target">of ${fmt(g.target)}</div>
            </div>

            <div class="goal-bar-wrap">
              <div class="goal-bar-fill ${complete ? 'complete' : ''}" style="width:${pct}%"></div>
            </div>

            <div class="goal-pct">${complete ? '🎉 Goal reached!' : pct + '% saved'}</div>

            <div class="goal-actions">
              <button class="btn-contribute" onclick="openContribute('${g.id}')">+ Add Savings</button>
              <button class="btn-danger"     onclick="deleteGoal('${g.id}')">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function deleteGoal(id) {
      if (!confirm('Delete this savings goal?')) return;
      saveGoals(getGoals().filter(g => g.id !== id));
      renderGoals();
    }

    // Open new-goal modal
    document.getElementById('openGoalModal').addEventListener('click', () => {
      document.getElementById('goalModal').classList.add('open');
    });

    document.getElementById('cancelGoalModal').addEventListener('click', () => {
      document.getElementById('goalModal').classList.remove('open');
    });

    document.getElementById('goalModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('open');
    });

    document.getElementById('saveGoalBtn').addEventListener('click', () => {
      const name   = document.getElementById('goalName').value.trim();
      const target = parseFloat(document.getElementById('goalTarget').value);
      const emoji  = document.getElementById('goalEmoji').value.trim() || '🎯';

      if (!name || isNaN(target) || target <= 0) {
        alert('Please provide a goal name and a valid target amount.');
        return;
      }

      const goals = getGoals();
      goals.push({ id: uid(), name, target, saved: 0, emoji });
      saveGoals(goals);

      document.getElementById('goalName').value   = '';
      document.getElementById('goalTarget').value = '';
      document.getElementById('goalEmoji').value  = '';
      document.getElementById('goalModal').classList.remove('open');
      renderGoals();
    });

    // ----- Contribute to a goal -----
    let activeGoalId = null; // track which goal we're adding to

    function openContribute(id) {
      activeGoalId = id;
      const goal = getGoals().find(g => g.id === id);
      document.getElementById('contributeModalTitle').textContent =
        `➕ Add to "${goal.name}"`;
      document.getElementById('contributeAmount').value = '';
      document.getElementById('contributeModal').classList.add('open');
    }

    document.getElementById('cancelContributeModal').addEventListener('click', () => {
      document.getElementById('contributeModal').classList.remove('open');
    });

    document.getElementById('contributeModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('open');
    });

    document.getElementById('saveContributeBtn').addEventListener('click', () => {
      const amount = parseFloat(document.getElementById('contributeAmount').value);

      if (isNaN(amount) || amount <= 0) {
        alert('Please enter a valid amount to add.');
        return;
      }

      const goals = getGoals();
      const goal  = goals.find(g => g.id === activeGoalId);
      if (!goal) return;

      goal.saved = Math.min(goal.target, goal.saved + amount);
      saveGoals(goals);
      document.getElementById('contributeModal').classList.remove('open');
      renderGoals();
    });

    renderGoals();

    // =========================================
    // INITIAL SUMMARY
    // =========================================
    updateSummary();
  </script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="../firebase.js"></script>
