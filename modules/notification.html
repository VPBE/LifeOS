<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeOS – Notifications</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    /* =========================================
       NOTIFICATION CENTER – LOCAL STYLES
       ========================================= */

    .notif-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 28px 20px;
      flex-wrap: wrap;
    }

    .filter-pill {
      padding: 7px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent;
      color: #8888aa;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font-body);
    }
    .filter-pill:hover { background: rgba(255,255,255,0.06); color: #f0f0f7; }
    .filter-pill.active {
      background: var(--accent-purple);
      border-color: var(--accent-purple);
      color: #fff;
      font-weight: 600;
    }

    .toolbar-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    /* Notification feed */
    .notif-feed {
      padding: 0 28px 48px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .notif-group-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 8px 0 4px;
    }

    .notif-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition), transform var(--transition);
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.3s ease both;
      text-decoration: none;
      color: inherit;
    }

    .notif-item:hover {
      background: var(--bg-card-hover);
      border-color: rgba(139,124,248,0.2);
      transform: translateX(2px);
    }

    .notif-item.unread {
      border-left: 3px solid var(--accent-purple);
    }

    .notif-item.unread::after {
      content: '';
      position: absolute;
      top: 18px; right: 18px;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent-purple);
      box-shadow: 0 0 6px rgba(139,124,248,0.6);
    }

    .notif-dot {
      width: 40px; height: 40px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .notif-dot.task       { background: rgba(56,189,248,0.12); }
    .notif-dot.exam,
    .notif-dot.assignment { background: rgba(62,207,142,0.12); }
    .notif-dot.habit      { background: rgba(245,166,35,0.12); }
    .notif-dot.finance    { background: rgba(245,166,35,0.12); }
    .notif-dot.creator    { background: rgba(224,102,160,0.12); }
    .notif-dot.reminder   { background: rgba(79,156,249,0.12); }
    .notif-dot.relationship { background: rgba(225,0,0,0.12); }
    .notif-dot.whop       { background: rgba(249,115,22,0.12); }
    .notif-dot.info,
    .notif-dot.success,
    .notif-dot.warning,
    .notif-dot.error      { background: rgba(139,124,248,0.12); }

    .notif-content { flex: 1; min-width: 0; }

    .notif-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .notif-msg {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .notif-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .notif-module-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .notif-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Module badge colors */
    .badge-task, .badge-reminder   { background: rgba(56,189,248,0.12);  color: #38bdf8; }
    .badge-exam, .badge-assignment { background: rgba(62,207,142,0.12);  color: #3ecf8e; }
    .badge-habit                   { background: rgba(245,166,35,0.12);  color: #f5a623; }
    .badge-finance                 { background: rgba(245,166,35,0.12);  color: #f5a623; }
    .badge-creator                 { background: rgba(224,102,160,0.12); color: #e066a0; }
    .badge-relationship            { background: rgba(225,0,0,0.12);     color: #f87171; }
    .badge-whop                    { background: rgba(249,115,22,0.12);  color: #f97316; }
    .badge-info, .badge-success,
    .badge-warning, .badge-error   { background: rgba(139,124,248,0.12); color: #8b7cf8; }

    /* Empty state */
    .notif-empty {
      text-align: center;
      padding: 64px 20px;
      color: var(--text-muted);
    }
    .notif-empty .e-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
    .notif-empty h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--text-primary); opacity: 0.7; }
    .notif-empty p  { font-size: 13px; }

    /* Stats strip */
    .notif-stats {
      display: flex;
      gap: 12px;
      padding: 0 28px 20px;
      flex-wrap: wrap;
    }

    .nstat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 100px;
    }
    .nstat-val {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      color: var(--accent-purple);
      letter-spacing: -1px;
    }
    .nstat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    @media (max-width: 640px) {
      .notif-toolbar { padding: 0 16px 16px; }
      .notif-feed    { padding: 0 16px 48px; }
      .notif-stats   { padding: 0 16px 16px; }
    }
  </style>
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">LifeOS</span>
    </div>
    <nav class="sidebar-nav">
      <a href="../index.html"      class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></a>
      <a href="school.html"        class="nav-item"><span class="nav-icon">🎓</span><span class="nav-label">School</span></a>
      <a href="productivity.html"  class="nav-item"><span class="nav-icon">✅</span><span class="nav-label">Productivity</span></a>
      <a href="notes.html"         class="nav-item"><span class="nav-icon">📝</span><span class="nav-label">Notes</span></a>
      <a href="finance.html"       class="nav-item"><span class="nav-icon">💰</span><span class="nav-label">Finance</span></a>
      <a href="creator.html"       class="nav-item"><span class="nav-icon">🎬</span><span class="nav-label">Creator</span></a>
      <a href="relationship.html"  class="nav-item"><span class="nav-icon">💕</span><span class="nav-label">Relationship</span></a>
      <a href="whop.html"          class="nav-item"><span class="nav-icon">🟠</span><span class="nav-label">Whop Clipping</span></a>
      <a href="ai.html"            class="nav-item"><span class="nav-icon">🤖</span><span class="nav-label">AI Assistant</span></a>
      <a href="notification.html"  class="nav-item active"><span class="nav-icon">🔔</span><span class="nav-label">Notifications</span></a>
	  <a href="calendar.html"      class="nav-item"><span class="nav-icon">📅</span><span class="nav-label">Calendar</span></a>
	  <a href="analytics.html"     class="nav-item"><span class="nav-icon">📈</span><span class="nav-label">Analytics</span></a>

        <span class="nav-icon">🎨</span><span class="nav-label">Personalize</span>

    <div class="sidebar-footer">
      <div id="sidebarUserName" style="font-size:12px;color:var(--text-muted);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px;"></div>
      <button onclick="lifeOSSignOut()" style="background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.25);color:#f87171;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;width:100%;transition:background 0.2s;" onmouseover="this.style.background='rgba(255,80,80,0.2)'" onmouseout="this.style.background='rgba(255,80,80,0.1)'">Sign Out</button>
    </div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content">

    <header class="topbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">☰</button>
      <div class="topbar-title">🔔 Notifications</div>
      <div class="topbar-date" id="currentDate"></div>
    </header>

    <div class="page-header">
      <h1>Notification Center</h1>
      <p>All alerts from every LifeOS module in one place.</p>
    </div>

    <!-- Stats -->
    <div class="notif-stats" id="notifStats"></div>

    <!-- Filter + actions toolbar -->
    <div class="notif-toolbar">
      <button class="filter-pill active" data-filter="all" onclick="setFilter('all', this)">All</button>
      <button class="filter-pill" data-filter="task"     onclick="setFilter('task', this)">✅ Tasks</button>
      <button class="filter-pill" data-filter="exam"     onclick="setFilter('exam', this)">🎓 Exams</button>
      <button class="filter-pill" data-filter="habit"    onclick="setFilter('habit', this)">🏆 Habits</button>
      <button class="filter-pill" data-filter="finance"  onclick="setFilter('finance', this)">💰 Finance</button>
      <button class="filter-pill" data-filter="creator"  onclick="setFilter('creator', this)">🎬 Creator</button>
      <div class="toolbar-actions">
        <button class="lifeos-btn secondary" onclick="markAllRead()" style="font-size:12px;padding:7px 14px;">✓ Mark all read</button>
        <button class="lifeos-btn danger"    onclick="clearAll()"    style="font-size:12px;padding:7px 14px;">🗑 Clear all</button>
      </div>
    </div>

    <!-- Feed -->
    <div class="notif-feed" id="notifFeed">
      <div class="notif-empty">
        <div class="e-icon">🔔</div>
        <h3>Loading…</h3>
        <p>Fetching your notifications</p>
      </div>
    </div>

  </main>

  <div class="overlay" id="overlay" style="display:none;"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="../firebase.js"></script>

  <!-- LifeOS: Auto-apply saved Personalization prefs -->
  <script>
  (async () => {
    try {
      await window.authReady;
      const prefs = await window.lifeOSLoad('lifeos_prefs', null);
      if (!prefs) return;
      const root = document.documentElement;
      if (prefs.theme && prefs.theme !== 'dark') root.setAttribute('data-lifeos-theme', prefs.theme);
      if (prefs.accent && prefs.accent !== 'purple') root.setAttribute('data-accent', prefs.accent);
      if (prefs.layout && prefs.layout !== 'auto') root.setAttribute('data-grid-layout', prefs.layout);
      if (prefs.compact)      root.setAttribute('data-layout-compact', 'true');
      if (prefs.miniSidebar)  root.setAttribute('data-sidebar-mini',   'true');
      if (prefs.reducedGlow)  root.setAttribute('data-reduced-glow',   'true');
      if (prefs.animations === false) root.style.setProperty('--transition', '0s');
      const mc = document.querySelector('.main-content');
      if (mc) {
        let css = '';
        if (prefs.wallpaper === 'custom' && prefs.wallpaperCustom) {
          css = 'url(' + prefs.wallpaperCustom + ')';
        } else if (prefs.wallpaper && prefs.wallpaper !== 'none') {
          const WP_MAP = {
            aurora: 'linear-gradient(135deg,#0d1117 0%,#1a0533 40%,#0a2540 100%)',
            cosmos: 'radial-gradient(ellipse at 30% 30%,#1a1a3e 0%,#0a0a1a 60%,#000 100%)',
            sunset: 'linear-gradient(160deg,#1a0533 0%,#3d0c4e 30%,#7c2d12 70%,#0a0a0a 100%)',
            ocean:  'linear-gradient(180deg,#001f3f 0%,#003d7a 40%,#001f3f 100%)',
            forest: 'linear-gradient(160deg,#022c22 0%,#064e3b 40%,#065f46 100%)',
            neon:   'linear-gradient(135deg,#0a0015 0%,#150025 50%,#001530 100%)',
            rose:   'linear-gradient(135deg,#1a0a10 0%,#3d1a25 50%,#2a1015 100%)',
          };
          css = WP_MAP[prefs.wallpaper] || '';
        }
        if (css) { mc.style.backgroundImage = css; mc.style.backgroundSize = 'cover'; mc.style.backgroundAttachment = 'fixed'; }
      }
    } catch (_) {}
  })();
  </script>
  <script src="../notifications.js"></script>

  <script>
  // =========================================
  // NOTIFICATION CENTER – PAGE LOGIC
  // =========================================

  const TYPE_ICONS = {
    success: '✅', error: '❌', warning: '⚠️', info: '💡',
    reminder: '🔔', habit: '🏆', exam: '🎓', task: '✅',
    finance: '💰', creator: '🎬', assignment: '📋',
    relationship: '💕', whop: '🟠',
  };

  const MODULE_LABELS = {
    task: 'Tasks', exam: 'School', assignment: 'School',
    habit: 'Habits', finance: 'Finance', creator: 'Creator',
    reminder: 'Productivity', relationship: 'Relationship',
    whop: 'Whop', info: 'System', success: 'System',
    warning: 'System', error: 'System',
  };

  let _currentFilter = 'all';
  let _log = [];

  function timeAgo(isoStr) {
    const diff = Date.now() - new Date(isoStr).getTime();
    const m = Math.floor(diff / 60000);
    if (m < 1)  return 'just now';
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    const d = Math.floor(h / 24);
    return `${d}d ago`;
  }

  function groupByDate(log) {
    const today     = new Date().toDateString();
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    const groups    = { Today: [], Yesterday: [], Earlier: [] };
    log.forEach(n => {
      const d = new Date(n.ts).toDateString();
      if (d === today)          groups.Today.push(n);
      else if (d === yesterday) groups.Yesterday.push(n);
      else                      groups.Earlier.push(n);
    });
    return groups;
  }

  function renderStats(log) {
    const unread = log.filter(n => !n.read).length;
    const today  = log.filter(n => new Date(n.ts).toDateString() === new Date().toDateString()).length;
    const el = document.getElementById('notifStats');
    el.innerHTML = `
      <div class="nstat"><div class="nstat-val">${log.length}</div><div class="nstat-label">Total</div></div>
      <div class="nstat"><div class="nstat-val" style="color:var(--accent-blue)">${unread}</div><div class="nstat-label">Unread</div></div>
      <div class="nstat"><div class="nstat-val" style="color:var(--accent-green)">${today}</div><div class="nstat-label">Today</div></div>
    `;
  }

  function renderFeed() {
    const feed = document.getElementById('notifFeed');
    const filtered = _currentFilter === 'all'
      ? _log
      : _log.filter(n => n.type === _currentFilter || (n.type === 'assignment' && _currentFilter === 'exam'));

    renderStats(_log);

    if (filtered.length === 0) {
      feed.innerHTML = `
        <div class="notif-empty">
          <div class="e-icon">🔔</div>
          <h3>${_currentFilter === 'all' ? 'No notifications yet' : 'Nothing here'}</h3>
          <p>${_currentFilter === 'all' ? 'Notifications from all your modules will appear here.' : 'No ' + _currentFilter + ' notifications found.'}</p>
        </div>`;
      return;
    }

    const groups = groupByDate(filtered);
    let html = '';

    Object.entries(groups).forEach(([label, items]) => {
      if (!items.length) return;
      html += `<div class="notif-group-label">${label}</div>`;
      items.forEach((n, idx) => {
        const icon  = TYPE_ICONS[n.type] || '🔔';
        const badge = MODULE_LABELS[n.type] || 'System';
        const url   = n.url || 'index.html';
        html += `
          <a class="notif-item${n.read ? '' : ' unread'}" href="${url}" onclick="markRead('${n.id}')"
             style="animation-delay:${idx * 0.04}s">
            <div class="notif-dot ${n.type}">${icon}</div>
            <div class="notif-content">
              <div class="notif-title">${escHtml(n.title)}</div>
              ${n.message ? `<div class="notif-msg">${escHtml(n.message)}</div>` : ''}
              <div class="notif-meta">
                <span class="notif-module-badge badge-${n.type}">${badge}</span>
                <span class="notif-time">${timeAgo(n.ts)}</span>
              </div>
            </div>
          </a>`;
      });
    });

    feed.innerHTML = html;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function setFilter(filter, btn) {
    _currentFilter = filter;
    document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderFeed();
  }

  function markRead(id) {
    _log = _log.map(n => n.id === id ? { ...n, read: true } : n);
    _saveLog();
  }

  function markAllRead() {
    _log = _log.map(n => ({ ...n, read: true }));
    _saveLog();
    renderFeed();
    if (window.lifeOSMarkAllRead) window.lifeOSMarkAllRead();
  }

  function clearAll() {
    if (!confirm('Clear all notifications? This cannot be undone.')) return;
    _log = [];
    _saveLog();
    renderFeed();
    if (window.lifeOSClearLog) window.lifeOSClearLog();
  }

  function _saveLog() {
    localStorage.setItem('lifeos_notif_log', JSON.stringify(_log));
    if (window.lifeOSSave) window.lifeOSSave('lifeos_notif_log', _log).catch(() => {});
    renderFeed();
  }

  // Date in topbar
  document.getElementById('currentDate').textContent =
    new Date().toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });

  // Sidebar hamburger
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const sidebar      = document.getElementById('sidebar');
  const overlay      = document.getElementById('overlay');
  hamburgerBtn.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('active');
    overlay.style.display = overlay.classList.contains('active') ? 'block' : 'none';
  });
  overlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
    overlay.style.display = 'none';
  });

  // Load log on auth ready
  window.authReady && window.authReady.then(async () => {
    // Try cloud first, fall back to local
    try {
      const cloud = await window.lifeOSLoad('lifeos_notif_log', null);
      if (cloud) { _log = cloud; }
      else {
        const local = localStorage.getItem('lifeos_notif_log');
        _log = local ? JSON.parse(local) : [];
      }
    } catch {
      const local = localStorage.getItem('lifeos_notif_log');
      _log = local ? JSON.parse(local) : [];
    }
    // Mark all as read since user is viewing the page
    window.lifeOSMarkAllRead && window.lifeOSMarkAllRead();
    _log = _log.map(n => ({ ...n, read: true }));
    renderFeed();
  });
  </script>
</body>
