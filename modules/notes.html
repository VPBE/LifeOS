<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeOS – Notes</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    .notes-layout {
      display: grid;
      grid-template-columns: 200px 280px 1fr;
      height: calc(100vh - 130px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin: 0 28px 28px;
    }
    .folder-panel {
      border-right: 1px solid var(--border);
      background: var(--bg-secondary);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-header {
      padding: 14px 14px 10px;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--text-muted);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .panel-add-btn {
      width: 22px; height: 22px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1); background: none;
      color: var(--text-muted); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; font-family: inherit; line-height: 1;
    }
    .panel-add-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
    .folder-list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
    .folder-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: 500; color: var(--text-muted);
      transition: background 0.15s, color 0.15s; user-select: none; position: relative;
    }
    .folder-item:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
    .folder-item.active { background: rgba(139,124,248,0.15); color: var(--accent-purple); font-weight: 600; }
    .folder-icon { font-size: 15px; flex-shrink: 0; }
    .folder-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .folder-count { font-size: 10px; background: rgba(255,255,255,0.08); color: var(--text-muted); padding: 1px 6px; border-radius: 99px; font-weight: 600; }
    .folder-item .folder-del { display: none; background: none; border: none; color: #f87171; font-size: 13px; cursor: pointer; padding: 0; font-family: inherit; }
    .folder-item:hover .folder-del { display: block; }
    .notelist-panel {
      border-right: 1px solid var(--border); background: var(--bg-card);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .notelist-toolbar {
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      display: flex; gap: 6px; flex-shrink: 0;
    }
    .notelist-search {
      flex: 1; background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text-primary); font-family: var(--font-body);
      font-size: 13px; padding: 7px 11px; outline: none; transition: border-color 0.2s;
    }
    .notelist-search:focus { border-color: var(--accent-purple); }
    .notelist-search::placeholder { color: var(--text-muted); }
    .new-note-btn {
      background: var(--accent-purple); border: none; border-radius: 8px; color: #fff;
      font-size: 18px; width: 34px; height: 34px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s; flex-shrink: 0;
    }
    .new-note-btn:hover { opacity: 0.85; }
    .notelist-tags {
      padding: 8px 12px; display: flex; gap: 6px; flex-wrap: wrap;
      border-bottom: 1px solid var(--border); flex-shrink: 0; min-height: 36px;
    }
    .tag-chip {
      font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
      border: 1px solid rgba(255,255,255,0.1); background: transparent;
      color: var(--text-muted); cursor: pointer; transition: all 0.15s; font-family: var(--font-body);
    }
    .tag-chip:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
    .tag-chip.active { background: rgba(139,124,248,0.2); border-color: var(--accent-purple); color: var(--accent-purple); }
    .notelist-scroll { flex: 1; overflow-y: auto; }
    .note-row {
      padding: 13px 14px; border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer; transition: background 0.15s; position: relative;
    }
    .note-row:hover { background: rgba(255,255,255,0.03); }
    .note-row.active { background: rgba(139,124,248,0.1); border-left: 2px solid var(--accent-purple); }
    .note-row-title { font-size: 13px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
    .note-row-preview { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
    .note-row-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .note-row-date { font-size: 10px; color: var(--text-muted); }
    .note-tag { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 99px; background: rgba(139,124,248,0.15); color: var(--accent-purple); }
    .note-attachment-icon { font-size: 11px; color: var(--text-muted); }
    .editor-panel {
      display: flex; flex-direction: column; overflow: hidden; background: var(--bg-primary);
    }
    .editor-toolbar {
      padding: 8px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap; flex-shrink: 0;
    }
    .editor-tool-btn {
      background: none; border: 1px solid transparent; border-radius: 6px;
      color: var(--text-muted); font-size: 12px; font-weight: 600; padding: 4px 7px;
      cursor: pointer; transition: all 0.15s; font-family: monospace;
    }
    .editor-tool-btn:hover { background: rgba(255,255,255,0.07); color: var(--text-primary); border-color: rgba(255,255,255,0.1); }
    .editor-tool-btn.active { background: rgba(139,124,248,0.15); color: var(--accent-purple); border-color: rgba(139,124,248,0.3); }
    .editor-sep { width: 1px; height: 18px; background: rgba(255,255,255,0.1); margin: 0 2px; }
    .editor-title-row { padding: 16px 20px 0; flex-shrink: 0; }
    .editor-title-input {
      width: 100%; background: none; border: none; color: var(--text-primary);
      font-family: var(--font-display); font-size: 22px; font-weight: 800; outline: none;
      padding: 0; letter-spacing: -0.5px;
    }
    .editor-title-input::placeholder { color: rgba(255,255,255,0.2); }
    .editor-meta-row {
      padding: 8px 20px; display: flex; align-items: center; gap: 10px;
      flex-wrap: wrap; flex-shrink: 0; border-bottom: 1px solid var(--border);
    }
    .meta-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .tag-input-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1; }
    .tag-pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
      background: rgba(139,124,248,0.18); color: var(--accent-purple);
    }
    .tag-pill button { background: none; border: none; color: var(--accent-purple); font-size: 12px; cursor: pointer; padding: 0; line-height: 1; font-family: inherit; }
    .tag-inline-input { background: none; border: none; color: var(--text-primary); font-family: var(--font-body); font-size: 12px; outline: none; min-width: 80px; }
    .tag-inline-input::placeholder { color: var(--text-muted); }
    .folder-select { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); font-family: var(--font-body); font-size: 12px; padding: 4px 8px; outline: none; cursor: pointer; }
    .editor-body { flex: 1; display: grid; grid-template-columns: 1fr; overflow: hidden; position: relative; }
    .editor-body.split { grid-template-columns: 1fr 1fr; }
    .editor-write {
      padding: 16px 20px; overflow-y: auto; resize: none; background: transparent;
      border: none; color: var(--text-primary); font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 14px; line-height: 1.7; outline: none; width: 100%;
    }
    .editor-write::placeholder { color: rgba(255,255,255,0.2); }
    .editor-preview { padding: 16px 24px; overflow-y: auto; border-left: 1px solid var(--border); }
    .editor-preview h1,.editor-preview h2,.editor-preview h3 { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.3px; margin: 1em 0 0.4em; color: var(--text-primary); }
    .editor-preview h1 { font-size: 22px; } .editor-preview h2 { font-size: 18px; } .editor-preview h3 { font-size: 15px; }
    .editor-preview p { font-size: 14px; line-height: 1.7; color: var(--text-primary); margin: 0.6em 0; }
    .editor-preview ul,.editor-preview ol { padding-left: 20px; margin: 0.5em 0; }
    .editor-preview li { font-size: 14px; line-height: 1.6; color: var(--text-primary); margin: 3px 0; }
    .editor-preview code { background: rgba(139,124,248,0.15); color: #a593ff; padding: 1px 5px; border-radius: 4px; font-family: monospace; font-size: 13px; }
    .editor-preview pre { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 14px 16px; overflow-x: auto; margin: 0.8em 0; }
    .editor-preview pre code { background: none; padding: 0; }
    .editor-preview blockquote { border-left: 3px solid var(--accent-purple); padding-left: 14px; margin: 0.7em 0; color: var(--text-muted); font-style: italic; }
    .editor-preview hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
    .editor-preview a { color: var(--accent-purple); text-decoration: underline; }
    .editor-preview strong { font-weight: 700; } .editor-preview em { font-style: italic; color: var(--text-muted); }
    .editor-preview table { border-collapse: collapse; width: 100%; margin: 0.8em 0; font-size: 13px; }
    .editor-preview th,.editor-preview td { border: 1px solid var(--border); padding: 8px 12px; }
    .editor-preview th { background: rgba(255,255,255,0.04); font-weight: 700; }
    .note-link { background: rgba(56,189,248,0.12); color: #38bdf8; border-radius: 4px; padding: 1px 5px; cursor: pointer; font-weight: 600; font-size: 13px; text-decoration: none; }
    .note-link:hover { background: rgba(56,189,248,0.22); }
    .attachment-bar {
      padding: 8px 16px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      flex-shrink: 0; background: var(--bg-secondary);
    }
    .attachment-chip {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500;
      padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08); color: var(--text-muted); cursor: default;
    }
    .att-del { color: #f87171; font-size: 13px; cursor: pointer; }
    .attach-btn { background: none; border: 1px dashed rgba(255,255,255,0.15); border-radius: 8px; color: var(--text-muted); font-size: 12px; font-weight: 600; padding: 5px 12px; cursor: pointer; transition: all 0.2s; font-family: var(--font-body); }
    .attach-btn:hover { border-color: var(--accent-purple); color: var(--accent-purple); }
    .editor-bottom { padding: 8px 16px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; }
    .editor-wordcount { font-size: 11px; color: var(--text-muted); }
    .save-btn { background: var(--accent-purple); border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 600; padding: 7px 18px; cursor: pointer; font-family: var(--font-body); transition: opacity 0.2s; }
    .save-btn:hover { opacity: 0.85; }
    .delete-note-btn { background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.25); border-radius: 8px; color: #f87171; font-size: 13px; font-weight: 600; padding: 6px 14px; cursor: pointer; font-family: var(--font-body); transition: background 0.2s; }
    .delete-note-btn:hover { background: rgba(255,80,80,0.2); }
    .link-autocomplete {
      position: fixed; background: var(--bg-card); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); padding: 6px;
      z-index: 300; min-width: 200px; max-height: 180px; overflow-y: auto; display: none;
    }
    .link-autocomplete.open { display: block; }
    .link-ac-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-primary); transition: background 0.1s; }
    .link-ac-item:hover { background: rgba(139,124,248,0.15); color: var(--accent-purple); }
    .editor-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); gap: 12px; padding: 40px; }
    .editor-empty .e-icon { font-size: 48px; opacity: 0.3; }
    .editor-empty p { font-size: 14px; text-align: center; opacity: 0.6; }
    #quickNotePopup {
      display: none; position: fixed; bottom: 80px; right: 24px;
      width: min(380px, calc(100vw - 40px)); background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;
      box-shadow: 0 16px 56px rgba(0,0,0,0.6); z-index: 9000; overflow: hidden;
    }
    #quickNotePopup.open { display: block; animation: fadeUp 0.25s ease both; }
    .qn-header { padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .qn-header span { font-size: 14px; font-weight: 700; }
    .qn-close { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 0; font-family: inherit; }
    .qn-body { padding: 12px 14px; }
    .qn-textarea { width: 100%; min-height: 100px; background: var(--bg-secondary); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: var(--text-primary); font-family: var(--font-body); font-size: 14px; line-height: 1.6; padding: 10px 13px; resize: none; outline: none; transition: border-color 0.2s; }
    .qn-textarea:focus { border-color: var(--accent-purple); }
    .qn-textarea::placeholder { color: var(--text-muted); }
    .qn-footer { padding: 8px 14px 14px; display: flex; align-items: center; justify-content: space-between; }
    .qn-hint { font-size: 11px; color: var(--text-muted); }
    .qn-save-btn { background: var(--accent-purple); border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 600; padding: 8px 16px; cursor: pointer; font-family: var(--font-body); transition: opacity 0.2s; }
    .qn-save-btn:hover { opacity: 0.85; }
    #quickNoteTrigger {
      position: fixed; bottom: 24px; right: 24px;
      width: 50px; height: 50px; border-radius: 50%;
      background: var(--accent-purple); border: none; color: #fff; font-size: 22px;
      cursor: pointer; box-shadow: 0 6px 24px rgba(139,124,248,0.5); z-index: 8999;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s; font-family: inherit;
    }
    #quickNoteTrigger:hover { transform: scale(1.08); box-shadow: 0 8px 32px rgba(139,124,248,0.65); }
    #quickNoteTrigger.active { transform: rotate(45deg); background: #4a4a6a; }
    .n-modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 500; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .n-modal-backdrop.open { display: flex; }
    .n-modal { background: var(--bg-secondary); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-lg); padding: 24px; width: min(400px, calc(100vw - 40px)); display: flex; flex-direction: column; gap: 12px; animation: fadeUp 0.2s ease both; }
    .n-modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .n-input { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-family: var(--font-body); font-size: 14px; padding: 10px 14px; width: 100%; outline: none; transition: border-color 0.2s; }
    .n-input:focus { border-color: var(--accent-purple); }
    .n-input::placeholder { color: var(--text-muted); }
    .n-modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
    .n-btn-cancel { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .n-btn-cancel:hover { background: rgba(255,255,255,0.05); }
    .n-btn-primary { background: var(--accent-purple); border: none; color: #fff; padding: 8px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity 0.2s; }
    .n-btn-primary:hover { opacity: 0.85; }
    @media (max-width: 900px) {
      .notes-layout { grid-template-columns: 160px 1fr; margin: 0 16px 16px; }
      .editor-panel { display: none; }
      .notes-layout.editing .notelist-panel { display: none; }
      .notes-layout.editing .editor-panel { display: flex; }
      .notes-layout.editing .folder-panel { display: none; }
    }
    @media (max-width: 600px) {
      .notes-layout { grid-template-columns: 1fr; }
      .folder-panel { display: none; }
      .editor-panel { display: none; }
      .notes-layout.editing .notelist-panel { display: none; }
      .notes-layout.editing .editor-panel { display: flex; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="brand-icon">⚡</span><span class="brand-name">LifeOS</span></div>
    <nav class="sidebar-nav">
      <a href="../index.html"     class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></a>
      <a href="school.html"       class="nav-item"><span class="nav-icon">🎓</span><span class="nav-label">School</span></a>
      <a href="productivity.html" class="nav-item"><span class="nav-icon">✅</span><span class="nav-label">Productivity</span></a>
      <a href="notes.html"        class="nav-item active"><span class="nav-icon">📝</span><span class="nav-label">Notes</span></a>
      <a href="finance.html"      class="nav-item"><span class="nav-icon">💰</span><span class="nav-label">Finance</span></a>
      <a href="creator.html"      class="nav-item"><span class="nav-icon">🎬</span><span class="nav-label">Creator</span></a>
      <a href="relationship.html" class="nav-item"><span class="nav-icon">💕</span><span class="nav-label">Relationship</span></a>
      <a href="whop.html"         class="nav-item"><span class="nav-icon">🟠</span><span class="nav-label">Whop Clipping</span></a>
      <a href="ai.html"           class="nav-item"><span class="nav-icon">🤖</span><span class="nav-label">AI Assistant</span></a>
      <a href="notification.html" class="nav-item"><span class="nav-icon">🔔</span><span class="nav-label">Notifications</span></a>
      <a href="calendar.html"     class="nav-item"><span class="nav-icon">📅</span><span class="nav-label">Calendar</span></a>
    </nav>
    <div class="sidebar-footer">
      <div id="sidebarUserName" style="font-size:12px;color:var(--text-muted);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px;"></div>
      <button onclick="lifeOSSignOut()" style="background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.25);color:#f87171;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;width:100%;transition:background 0.2s;" onmouseover="this.style.background='rgba(255,80,80,0.2)'" onmouseout="this.style.background='rgba(255,80,80,0.1)'">Sign Out</button>
    </div>
  </aside>

  <main class="main-content" style="overflow:hidden;padding-bottom:0;">
    <header class="topbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">☰</button>
      <div class="topbar-title">📝 Notes</div>
      <div class="topbar-date" id="currentDate"></div>
    </header>

    <div class="notes-layout" id="notesLayout">
      <!-- FOLDER PANEL -->
      <div class="folder-panel">
        <div class="panel-header">Folders <button class="panel-add-btn" onclick="openFolderModal()">+</button></div>
        <div class="folder-list" id="folderList"></div>
      </div>

      <!-- NOTE LIST PANEL -->
      <div class="notelist-panel">
        <div class="notelist-toolbar">
          <input class="notelist-search" id="noteSearch" placeholder="Search notes…" oninput="renderNoteList()" />
          <button class="new-note-btn" onclick="createNewNote()">+</button>
        </div>
        <div class="notelist-tags" id="tagFilterBar"></div>
        <div class="notelist-scroll" id="noteListScroll"></div>
      </div>

      <!-- EDITOR PANEL -->
      <div class="editor-panel" id="editorPanel">
        <div class="editor-empty" id="editorEmpty">
          <div class="e-icon">📝</div>
          <p>Select a note to edit<br>or create a new one</p>
          <button class="save-btn" onclick="createNewNote()" style="margin-top:8px;">New Note</button>
        </div>

        <div id="editorContent" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
          <div class="editor-toolbar">
            <button class="editor-tool-btn" onclick="fmt('bold')"><b>B</b></button>
            <button class="editor-tool-btn" onclick="fmt('italic')"><i>I</i></button>
            <button class="editor-tool-btn" onclick="fmt('strike')">~~S~~</button>
            <div class="editor-sep"></div>
            <button class="editor-tool-btn" onclick="fmt('h1')">H1</button>
            <button class="editor-tool-btn" onclick="fmt('h2')">H2</button>
            <button class="editor-tool-btn" onclick="fmt('h3')">H3</button>
            <div class="editor-sep"></div>
            <button class="editor-tool-btn" onclick="fmt('ul')">• List</button>
            <button class="editor-tool-btn" onclick="fmt('ol')">1. List</button>
            <button class="editor-tool-btn" onclick="fmt('code')">`code`</button>
            <button class="editor-tool-btn" onclick="fmt('quote')">" Quote</button>
            <button class="editor-tool-btn" onclick="fmt('hr')">—</button>
            <button class="editor-tool-btn" onclick="fmt('link')">[[link]]</button>
            <div class="editor-sep"></div>
            <button class="editor-tool-btn" id="splitToggle" onclick="toggleSplit()">⌥ Preview</button>
          </div>

          <div class="editor-title-row">
            <input class="editor-title-input" id="editorTitle" placeholder="Note title…" oninput="markDirty()" />
          </div>

          <div class="editor-meta-row">
            <span class="meta-label">🏷</span>
            <div class="tag-input-wrap" id="tagInputWrap">
              <input class="tag-inline-input" id="tagInput" placeholder="Add tag, Enter…" maxlength="30" />
            </div>
            <span class="meta-label" style="margin-left:8px;">📁</span>
            <select class="folder-select" id="editorFolder" onchange="markDirty()"></select>
          </div>

          <div class="editor-body" id="editorBody">
            <textarea class="editor-write" id="editorWrite"
              placeholder="Start writing… **bold**, _italic_, # Heading, - list, `code`, [[Note Title]] to link"
              oninput="onEditorInput(this)"></textarea>
            <div class="editor-preview" id="editorPreview" style="display:none;"></div>
          </div>

          <div class="attachment-bar" id="attachmentBar">
            <span style="font-size:11px;color:var(--text-muted);font-weight:600;">📎 Attachments</span>
            <div id="attachmentChips" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
            <button class="attach-btn" onclick="document.getElementById('fileInput').click()">+ Attach File</button>
            <input type="file" id="fileInput" style="display:none" multiple onchange="onFilesAttached(this)" />
          </div>

          <div class="editor-bottom">
            <span class="editor-wordcount" id="wordCount">0 words</span>
            <div style="display:flex;gap:8px;">
              <button class="delete-note-btn" onclick="deleteCurrentNote()">🗑 Delete</button>
              <button class="save-btn" onclick="saveCurrentNote()">💾 Save</button>
            </div>
          </div>
        </div>

        <div class="link-autocomplete" id="linkAC"></div>
      </div>
    </div>
  </main>

  <!-- Quick Note Popup -->
  <div id="quickNotePopup">
    <div class="qn-header">
      <span>⚡ Quick Note</span>
      <button class="qn-close" onclick="closeQuickNote()">✕</button>
    </div>
    <div class="qn-body">
      <textarea class="qn-textarea" id="qnText" placeholder="Jot it down fast… supports **markdown** and [[links]]"></textarea>
    </div>
    <div class="qn-footer">
      <span class="qn-hint">⌘K to open · ⌘↵ to save</span>
      <button class="qn-save-btn" onclick="saveQuickNote()">Save →</button>
    </div>
  </div>

  <button id="quickNoteTrigger" title="Quick Note (⌘K)" onclick="toggleQuickNote()">✏️</button>

  <!-- Folder Modal -->
  <div class="n-modal-backdrop" id="folderModal">
    <div class="n-modal">
      <h3>📁 New Folder</h3>
      <input class="n-input" id="folderNameInput" placeholder="Folder name…" maxlength="40" />
      <div style="display:flex;gap:6px;flex-wrap:wrap;" id="folderEmojiRow"></div>
      <div class="n-modal-actions">
        <button class="n-btn-cancel" onclick="closeFolderModal()">Cancel</button>
        <button class="n-btn-primary" onclick="createFolder()">Create</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" style="display:none;"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="../firebase.js"></script>
  <script src="../notifications.js"></script>

  <script>
  const NK = { notes:'lifeos_notes_v2', folders:'lifeos_note_folders' };
  let _notes=[], _folders=[], _activeNoteId=null, _activeFolderId='all', _activeTag=null, _dirty=false, _splitMode=false, _pendingEmoji='📁', _editingTags=[];

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtDate(iso){ return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
  function wordCount(s){ return (s||'').trim().split(/\s+/).filter(Boolean).length; }

  async function loadAll(){
    _notes   = await lifeOSLoad(NK.notes,   []);
    _folders = await lifeOSLoad(NK.folders, []);
    // Migrate old quick notes
    try {
      const oldQ = await lifeOSLoad('lifeos_notes_quick', null);
      if(oldQ && oldQ.length && !_folders.find(f=>f.id==='qlegacy')){
        _folders.push({id:'qlegacy',name:'Quick Notes (imported)',icon:'⚡'});
        oldQ.forEach(n=>{ if(!_notes.find(x=>x.body===n.text)) _notes.push({id:uid(),title:n.text.slice(0,40)||'Quick Note',body:n.text,tags:[],folderId:'qlegacy',attachments:[],isQuick:true,date:n.date,updated:n.date}); });
        await saveAll();
      }
    } catch(e){}
    renderFolders(); renderNoteList(); renderTagBar();
  }

  async function saveAll(){
    await lifeOSSave(NK.notes,_notes);
    await lifeOSSave(NK.folders,_folders);
    await lifeOSSave('lifeos_notes',_notes);
  }

  function renderMarkdown(md){
    if(!window.marked) return esc(md).replace(/\n/g,'<br>');
    const withLinks = md.replace(/\[\[([^\]]+)\]\]/g,(_,title)=>{
      const found=_notes.find(n=>n.title&&n.title.toLowerCase()===title.toLowerCase());
      return found
        ? `<a class="note-link" onclick="openNote('${found.id}')">${esc(title)}</a>`
        : `<span class="note-link" style="opacity:0.5">${esc(title)}</span>`;
    });
    return marked.parse(withLinks,{breaks:true});
  }

  function renderFolders(){
    const counts={};
    _notes.forEach(n=>{ counts[n.folderId||'none']=(counts[n.folderId||'none']||0)+1; });
    const specials=[{id:'all',icon:'📚',name:'All Notes',count:_notes.length},{id:'quick',icon:'⚡',name:'Quick Notes',count:_notes.filter(n=>n.isQuick).length}];
    let html=specials.map(s=>`<div class="folder-item${_activeFolderId===s.id?' active':''}" onclick="setFolder('${s.id}')"><span class="folder-icon">${s.icon}</span><span class="folder-name">${s.name}</span><span class="folder-count">${s.count}</span></div>`).join('');
    html+=_folders.map(f=>`<div class="folder-item${_activeFolderId===f.id?' active':''}" onclick="setFolder('${f.id}')"><span class="folder-icon">${f.icon||'📁'}</span><span class="folder-name">${esc(f.name)}</span><span class="folder-count">${counts[f.id]||0}</span><button class="folder-del" onclick="deleteFolder(event,'${f.id}')">✕</button></div>`).join('');
    document.getElementById('folderList').innerHTML=html;
  }

  function setFolder(id){ _activeFolderId=id; _activeTag=null; renderFolders(); renderNoteList(); renderTagBar(); }

  function getAllTags(){ const s=new Set(); _notes.forEach(n=>(n.tags||[]).forEach(t=>s.add(t))); return[...s].sort(); }

  function renderTagBar(){
    const tags=getAllTags();
    document.getElementById('tagFilterBar').innerHTML=tags.length
      ? tags.map(t=>`<button class="tag-chip${_activeTag===t?' active':''}" onclick="setTag('${esc(t)}')">#${esc(t)}</button>`).join('')
      : '';
  }

  function setTag(tag){ _activeTag=_activeTag===tag?null:tag; renderTagBar(); renderNoteList(); }

  function filteredNotes(){
    let notes=[..._notes];
    if(_activeFolderId==='quick') notes=notes.filter(n=>n.isQuick);
    else if(_activeFolderId!=='all') notes=notes.filter(n=>n.folderId===_activeFolderId);
    if(_activeTag) notes=notes.filter(n=>(n.tags||[]).includes(_activeTag));
    const q=(document.getElementById('noteSearch')?.value||'').toLowerCase().trim();
    if(q) notes=notes.filter(n=>(n.title||'').toLowerCase().includes(q)||(n.body||'').toLowerCase().includes(q)||(n.tags||[]).some(t=>t.toLowerCase().includes(q)));
    return notes.sort((a,b)=>new Date(b.updated||b.date)-new Date(a.updated||a.date));
  }

  function renderNoteList(){
    const scroll=document.getElementById('noteListScroll');
    const notes=filteredNotes();
    if(!notes.length){ scroll.innerHTML=`<div style="text-align:center;padding:40px 16px;color:var(--text-muted);font-size:13px;">No notes found.<br><button onclick="createNewNote()" style="margin-top:12px;background:var(--accent-purple);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:600;padding:7px 16px;cursor:pointer;font-family:inherit;">+ New Note</button></div>`; return; }
    scroll.innerHTML=notes.map(n=>{
      const preview=(n.body||'').replace(/[#*`_~>\[\]]/g,'').slice(0,80);
      const tagHtml=(n.tags||[]).slice(0,3).map(t=>`<span class="note-tag">#${esc(t)}</span>`).join('');
      const attIcon=(n.attachments||[]).length?`<span class="note-attachment-icon">📎${n.attachments.length}</span>`:'';
      return `<div class="note-row${_activeNoteId===n.id?' active':''}" onclick="openNote('${n.id}')"><div class="note-row-title">${esc(n.title)||'Untitled'}</div><div class="note-row-preview">${esc(preview)||'Empty note'}</div><div class="note-row-meta"><span class="note-row-date">${fmtDate(n.updated||n.date)}</span>${tagHtml}${attIcon}</div></div>`;
    }).join('');
  }

  function openNote(id){
    if(_dirty&&_activeNoteId){ if(confirm('Save changes?')) saveCurrentNote(); }
    const note=_notes.find(n=>n.id===id); if(!note) return;
    _activeNoteId=id; _dirty=false;
    document.getElementById('editorEmpty').style.display='none';
    const ec=document.getElementById('editorContent');
    ec.style.display='flex'; ec.style.flexDirection='column';
    document.getElementById('editorTitle').value=note.title||'';
    document.getElementById('editorWrite').value=note.body||'';
    renderEditorTags(note.tags||[]);
    populateFolderSelect(note.folderId);
    updateWordCount(note.body||'');
    renderAttachments(note.attachments||[]);
    if(_splitMode) updatePreview();
    renderNoteList();
    document.getElementById('notesLayout').classList.add('editing');
  }

  function createNewNote(){
    if(_dirty&&_activeNoteId) saveCurrentNote();
    const folderId=_activeFolderId==='all'||_activeFolderId==='quick'?'':_activeFolderId;
    const note={id:uid(),title:'',body:'',tags:[],folderId,attachments:[],isQuick:_activeFolderId==='quick',date:new Date().toISOString(),updated:new Date().toISOString()};
    _notes.unshift(note);
    openNote(note.id);
    document.getElementById('editorTitle').focus();
  }

  async function saveCurrentNote(){
    if(!_activeNoteId) return;
    const idx=_notes.findIndex(n=>n.id===_activeNoteId); if(idx<0) return;
    _notes[idx].title=document.getElementById('editorTitle').value.trim()||'Untitled';
    _notes[idx].body=document.getElementById('editorWrite').value;
    _notes[idx].folderId=document.getElementById('editorFolder').value;
    _notes[idx].tags=[..._editingTags];
    _notes[idx].updated=new Date().toISOString();
    _dirty=false;
    await saveAll();
    renderNoteList(); renderFolders(); renderTagBar();
    if(window.lifeOSToast) window.lifeOSToast({title:'Note saved',type:'success',duration:1500,sound:false});
  }

  function markDirty(){ _dirty=true; }

  async function deleteCurrentNote(){
    if(!_activeNoteId) return;
    if(!confirm('Delete this note? Cannot be undone.')) return;
    _notes=_notes.filter(n=>n.id!==_activeNoteId);
    _activeNoteId=null; _dirty=false;
    document.getElementById('editorEmpty').style.display='flex';
    document.getElementById('editorContent').style.display='none';
    document.getElementById('notesLayout').classList.remove('editing');
    await saveAll(); renderNoteList(); renderFolders(); renderTagBar();
  }

  function renderEditorTags(tags){
    _editingTags=[...tags];
    const wrap=document.getElementById('tagInputWrap');
    const input=document.getElementById('tagInput');
    wrap.querySelectorAll('.tag-pill').forEach(p=>p.remove());
    _editingTags.forEach(t=>{ const pill=document.createElement('span'); pill.className='tag-pill'; pill.innerHTML=`#${esc(t)} <button onclick="removeTag('${esc(t)}')">✕</button>`; wrap.insertBefore(pill,input); });
  }

  function removeTag(tag){ _editingTags=_editingTags.filter(t=>t!==tag); renderEditorTags(_editingTags); markDirty(); }

  document.getElementById('tagInput').addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==',') return;
    e.preventDefault();
    const val=e.target.value.trim().replace(/^#/,'').replace(/\s+/g,'-').toLowerCase();
    if(!val||_editingTags.includes(val)){e.target.value='';return;}
    _editingTags.push(val); e.target.value='';
    renderEditorTags(_editingTags); renderTagBar(); markDirty();
  });

  function populateFolderSelect(sel){
    document.getElementById('editorFolder').innerHTML=`<option value="">No folder</option>`+_folders.map(f=>`<option value="${f.id}"${f.id===sel?' selected':''}>${f.icon||'📁'} ${esc(f.name)}</option>`).join('');
  }

  function toggleSplit(){
    _splitMode=!_splitMode;
    const body=document.getElementById('editorBody');
    const preview=document.getElementById('editorPreview');
    const btn=document.getElementById('splitToggle');
    body.classList.toggle('split',_splitMode);
    preview.style.display=_splitMode?'block':'none';
    btn.classList.toggle('active',_splitMode);
    if(_splitMode) updatePreview();
  }

  function updatePreview(){ document.getElementById('editorPreview').innerHTML=renderMarkdown(document.getElementById('editorWrite').value); }

  function fmt(type){
    const ta=document.getElementById('editorWrite');
    const s=ta.selectionStart, e2=ta.selectionEnd, sel=ta.value.slice(s,e2);
    const map={bold:[`**`,`**`,sel||'bold text'],italic:[`_`,`_`,sel||'italic'],strike:[`~~`,`~~`,sel||'text'],h1:[`# `,`\n`,sel||'Heading 1'],h2:[`## `,`\n`,sel||'Heading 2'],h3:[`### `,`\n`,sel||'Heading 3'],ul:[`- `,`\n`,sel||'item'],ol:[`1. `,`\n`,sel||'item'],code:['`','`',sel||'code'],quote:['> ','\n',sel||'quote'],hr:['\n---\n','',''],link:['[[',']]',sel||'Note Title']};
    if(!map[type]) return;
    const [pre,post,text]=map[type];
    const insert=pre+text+post;
    ta.focus(); ta.setRangeText(insert,s,e2,'end');
    ta.selectionStart=ta.selectionEnd=s+pre.length+text.length;
    onEditorInput(ta);
  }

  function onEditorInput(ta){ markDirty(); updateWordCount(ta.value); if(_splitMode) updatePreview(); checkLinkAC(ta); }
  function updateWordCount(t){ document.getElementById('wordCount').textContent=`${wordCount(t)} words`; }

  function checkLinkAC(ta){
    const val=ta.value, pos=ta.selectionStart;
    const match=val.slice(0,pos).match(/\[\[([^\]]*?)$/);
    if(!match){closeAC();return;}
    const q=match[1].toLowerCase();
    const matches=_notes.filter(n=>n.title&&n.title.toLowerCase().includes(q)&&n.id!==_activeNoteId).slice(0,8);
    if(!matches.length){closeAC();return;}
    const ac=document.getElementById('linkAC');
    ac.innerHTML=matches.map(n=>`<div class="link-ac-item" onmousedown="insertLink('${esc(n.title)}')">${esc(n.title)}</div>`).join('');
    const rect=ta.getBoundingClientRect();
    ac.style.top=(rect.top+20)+'px'; ac.style.left=(rect.left+20)+'px';
    ac.classList.add('open');
  }

  function insertLink(title){
    const ta=document.getElementById('editorWrite');
    const pos=ta.selectionStart, val=ta.value;
    const si=val.slice(0,pos).lastIndexOf('[[');
    ta.value=val.slice(0,si)+`[[${title}]]`+val.slice(pos);
    ta.selectionStart=ta.selectionEnd=si+title.length+4;
    closeAC(); onEditorInput(ta);
  }

  function closeAC(){ document.getElementById('linkAC').classList.remove('open'); }
  document.addEventListener('click',()=>closeAC());

  function onFilesAttached(input){
    const files=Array.from(input.files); if(!_activeNoteId) return;
    const idx=_notes.findIndex(n=>n.id===_activeNoteId); if(idx<0) return;
    if(!_notes[idx].attachments) _notes[idx].attachments=[];
    files.forEach(f=>{ _notes[idx].attachments.push({name:f.name,size:f.size,type:f.type,id:uid()}); });
    renderAttachments(_notes[idx].attachments); markDirty(); input.value='';
  }

  function renderAttachments(att){
    document.getElementById('attachmentChips').innerHTML=(att||[]).map(a=>{
      const icon=a.type?.startsWith('image')?'🖼':a.type?.includes('pdf')?'📄':'📎';
      const size=a.size>1048576?(a.size/1048576).toFixed(1)+'MB':Math.round(a.size/1024)+'KB';
      return `<span class="attachment-chip">${icon} ${esc(a.name)} <span style="opacity:0.5;font-size:10px">${size}</span> <span class="att-del" onclick="removeAttachment('${a.id}')">✕</span></span>`;
    }).join('');
  }

  function removeAttachment(attId){
    if(!_activeNoteId) return;
    const idx=_notes.findIndex(n=>n.id===_activeNoteId); if(idx<0) return;
    _notes[idx].attachments=(_notes[idx].attachments||[]).filter(a=>a.id!==attId);
    renderAttachments(_notes[idx].attachments); markDirty();
  }

  const EMOJIS=['📁','📚','🎓','💼','💡','🎬','💰','❤️','🏠','⚡','🔬','✏️','📌','🗂','🧠','🌟'];

  function openFolderModal(){
    document.getElementById('folderEmojiRow').innerHTML=EMOJIS.map(e=>`<button onclick="selectEmoji('${e}')" style="font-size:20px;background:none;border:1px solid rgba(255,255,255,0.1);border-radius:8px;width:36px;height:36px;cursor:pointer;">${e}</button>`).join('');
    _pendingEmoji='📁';
    document.getElementById('folderNameInput').value='';
    document.getElementById('folderModal').classList.add('open');
    setTimeout(()=>document.getElementById('folderNameInput').focus(),50);
  }

  function selectEmoji(e){ _pendingEmoji=e; }
  function closeFolderModal(){ document.getElementById('folderModal').classList.remove('open'); }

  async function createFolder(){
    const name=document.getElementById('folderNameInput').value.trim(); if(!name) return;
    _folders.push({id:uid(),name,icon:_pendingEmoji});
    await saveAll(); renderFolders(); populateFolderSelect(null); closeFolderModal();
  }

  async function deleteFolder(e,id){
    e.stopPropagation();
    if(!confirm('Delete this folder? Notes will move to No folder.')) return;
    _folders=_folders.filter(f=>f.id!==id);
    _notes.forEach(n=>{if(n.folderId===id) n.folderId='';});
    if(_activeFolderId===id) _activeFolderId='all';
    await saveAll(); renderFolders(); renderNoteList();
  }

  function toggleQuickNote(){
    const popup=document.getElementById('quickNotePopup');
    const btn=document.getElementById('quickNoteTrigger');
    const open=popup.classList.toggle('open');
    btn.classList.toggle('active',open);
    if(open) setTimeout(()=>document.getElementById('qnText').focus(),50);
  }

  function closeQuickNote(){
    document.getElementById('quickNotePopup').classList.remove('open');
    document.getElementById('quickNoteTrigger').classList.remove('active');
  }

  async function saveQuickNote(){
    const text=document.getElementById('qnText').value.trim(); if(!text) return;
    const note={id:uid(),title:text.split('\n')[0].replace(/[#*`_~]/g,'').slice(0,60)||'Quick Note',body:text,tags:[],folderId:'',isQuick:true,attachments:[],date:new Date().toISOString(),updated:new Date().toISOString()};
    _notes.unshift(note); await saveAll(); renderNoteList(); renderFolders();
    document.getElementById('qnText').value=''; closeQuickNote();
    if(window.lifeOSToast) window.lifeOSToast({title:'⚡ Quick note saved!',type:'success',duration:2000,sound:'ping'});
  }

  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();toggleQuickNote();}
    if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();saveCurrentNote();}
    if(e.key==='Escape'){closeQuickNote();closeAC();if(window.innerWidth<900) document.getElementById('notesLayout').classList.remove('editing');}
  });

  document.getElementById('qnText').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();saveQuickNote();}
  });

  document.getElementById('hamburgerBtn').addEventListener('click',()=>{
    document.getElementById('sidebar').classList.toggle('open');
    const ov=document.getElementById('overlay'); ov.classList.toggle('active'); ov.style.display=ov.classList.contains('active')?'block':'none';
  });
  document.getElementById('overlay').addEventListener('click',()=>{
    document.getElementById('sidebar').classList.remove('open');
    const ov=document.getElementById('overlay'); ov.classList.remove('active'); ov.style.display='none';
  });

  document.getElementById('currentDate').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  document.getElementById('folderModal').addEventListener('click',function(e){if(e.target===this) closeFolderModal();});

  (async()=>{ await window.authReady; await loadAll(); })();
  </script>
</body>
</html>
