<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeOS – Notes</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    /* =========================================
       NOTES MODULE – LOCAL STYLES
       ========================================= */

    /* ----- Tab Navigation ----- */
    .tab-bar {
      display: flex;
      gap: 6px;
      padding: 20px 28px 0;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color var(--transition), border-color var(--transition);
      font-family: inherit;
    }

    .tab-btn:hover {
      color: var(--text-primary);
    }

    .tab-btn.active {
      color: var(--notes-color);
      border-bottom-color: var(--notes-color);
    }

    /* ----- Tab Panels ----- */
    .tab-panel {
      display: none;
      padding: 24px 28px;
      animation: fadeIn 0.2s ease;
    }

    .tab-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ----- Section Header ----- */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    /* ----- Buttons ----- */
    .btn-primary {
      background: var(--notes-color);
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity var(--transition);
    }

    .btn-primary:hover { opacity: 0.85; }

    .btn-danger {
      background: rgba(255, 80, 80, 0.15);
      color: #ff5050;
      border: 1px solid rgba(255, 80, 80, 0.3);
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--transition);
    }

    .btn-danger:hover { background: rgba(255, 80, 80, 0.28); }

    /* ----- Input Styles ----- */
    .input-field {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      width: 100%;
      transition: border-color var(--transition);
      outline: none;
    }

    .input-field:focus {
      border-color: var(--notes-color);
    }

    .input-field::placeholder {
      color: var(--text-muted);
    }

    textarea.input-field {
      resize: vertical;
      min-height: 90px;
      line-height: 1.5;
    }

    /* ----- Modal Overlay ----- */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal h3 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .btn-cancel {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--transition);
    }

    .btn-cancel:hover { background: rgba(255,255,255,0.05); }

    /* ==========================================
       QUICK NOTES
       ========================================== */

    /* Inline quick-add bar */
    .quick-add-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .quick-add-bar .input-field {
      flex: 1;
    }

    /* Sticky-note grid */
    .sticky-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }

    .sticky-note {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      position: relative;
      transition: border-color var(--transition);
    }

    .sticky-note:hover {
      border-color: var(--notes-color);
    }

    .sticky-note-text {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      word-break: break-word;
      white-space: pre-wrap;
    }

    .sticky-note-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sticky-note-date {
      font-size: 11px;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: 40px 0;
    }

    .empty-state .empty-icon {
      font-size: 36px;
      display: block;
      margin-bottom: 10px;
    }

    /* ==========================================
       LECTURE NOTES
       ========================================== */

    .lecture-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lecture-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: border-color var(--transition);
    }

    .lecture-card:hover {
      border-color: var(--notes-color);
    }

    /* Clicking the header expands the body */
    .lecture-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      cursor: pointer;
      gap: 12px;
    }

    .lecture-meta {
      flex: 1;
    }

    .lecture-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .lecture-subject {
      font-size: 12px;
      background: rgba(124, 111, 224, 0.18);
      color: var(--notes-color);
      padding: 2px 8px;
      border-radius: 20px;
      display: inline-block;
    }

    .lecture-card-body {
      display: none;
      padding: 0 18px 16px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-muted);
      white-space: pre-wrap;
      word-break: break-word;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .lecture-card.expanded .lecture-card-body {
      display: block;
    }

    .lecture-toggle {
      font-size: 18px;
      color: var(--text-muted);
      transition: transform var(--transition);
    }

    .lecture-card.expanded .lecture-toggle {
      transform: rotate(180deg);
    }

    .lecture-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    /* ==========================================
       IDEA VAULT
       ========================================== */

    .idea-filters {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: rgba(124, 111, 224, 0.15);
      color: var(--notes-color);
      border-color: var(--notes-color);
    }

    .ideas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }

    .idea-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color var(--transition), transform var(--transition);
    }

    .idea-card:hover {
      border-color: var(--notes-color);
      transform: translateY(-2px);
    }

    .idea-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .idea-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      flex: 1;
    }

    .idea-description {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .idea-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* Category badges */
    .badge-category {
      background: rgba(255,255,255,0.07);
      color: var(--text-muted);
    }

    /* Status badges */
    .badge-raw       { background: rgba(245,166,35,0.18);  color: var(--accent-amber); }
    .badge-developing{ background: rgba(79,156,249,0.18);  color: var(--accent-blue); }
    .badge-ready     { background: rgba(62,207,142,0.18);  color: var(--accent-green); }
    .badge-done      { background: rgba(136,136,170,0.18); color: var(--text-muted); }

    /* Select styled to match */
    .input-select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      width: 100%;
      outline: none;
      cursor: pointer;
      transition: border-color var(--transition);
    }

    .input-select:focus {
      border-color: var(--notes-color);
    }

    /* ==========================================
       RESPONSIVE
       ========================================== */

    @media (max-width: 640px) {
      .tab-bar   { padding: 16px 16px 0; }
      .tab-panel { padding: 18px 16px; }
      .tab-btn   { font-size: 13px; padding: 8px 12px 10px; }
      .sticky-grid { grid-template-columns: 1fr 1fr; }
      .ideas-grid  { grid-template-columns: 1fr; }
    }

    @media (max-width: 400px) {
      .sticky-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>
    // =========================================
    // NOTES MODULE – notes.js (inline)
    // =========================================

    // ----- HTML escape to prevent XSS (defined first so it's available everywhere) -----
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ----- localStorage keys -----
    const KEYS = {
      quick:   'lifeos_notes_quick',    // Array of { id, text, date }
      lecture: 'lifeos_notes_lecture',  // Array of { id, title, subject, body, date }
      ideas:   'lifeos_notes_ideas'     // Array of { id, title, desc, category, status, date }
    };

    // ----- Helper: generate a simple unique ID -----
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    // ----- Helper: format a date string for display -----
    function fmtDate(isoStr) {
      return new Date(isoStr).toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric'
      });
    }

    // =========================================
    // TAB SWITCHING
    // =========================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        // Deactivate all tabs
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        // Activate clicked tab
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });


    // =========================================
    // SECTION 1 – QUICK NOTES
    // =========================================

    async function getQuickNotes() {
      return await lifeOSLoad(KEYS.quick, []);
    }

    async function saveQuickNotes(arr) {
      await lifeOSSave(KEYS.quick, arr);
      // Also update the global notes count used by the dashboard
      await lifeOSSave('lifeos_notes', arr);
    }

    async function renderQuickNotes() {
      const grid  = document.getElementById('stickyGrid');
      const notes = await getQuickNotes();

      if (notes.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <span class="empty-icon">📋</span>
            No quick notes yet. Type something above and hit Add!
          </div>`;
        return;
      }

      grid.innerHTML = [...notes].reverse().map(n => `
        <div class="sticky-note" data-id="${n.id}">
          <div class="sticky-note-text">${escHtml(n.text)}</div>
          <div class="sticky-note-footer">
            <span class="sticky-note-date">${fmtDate(n.date)}</span>
            <button class="btn-danger" onclick="deleteQuick('${n.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function addQuickNote() {
      const input = document.getElementById('quickInput');
      const text  = input.value.trim();
      if (!text) return;

      const notes = await getQuickNotes();
      notes.push({ id: uid(), text, date: new Date().toISOString() });
      await saveQuickNotes(notes);
      input.value = '';
      await renderQuickNotes();
    }

    async function deleteQuick(id) {
      const notes = (await getQuickNotes()).filter(n => n.id !== id);
      await saveQuickNotes(notes);
      await renderQuickNotes();
    }

    document.getElementById('quickInput').addEventListener('keydown', async e => {
      if (e.key === 'Enter') await addQuickNote();
    });

    document.getElementById('quickAddBtn').addEventListener('click', addQuickNote);

    // Initial render

    // =========================================
    // SECTION 2 – LECTURE NOTES
    // =========================================

    async function getLectures() {
      return await lifeOSLoad(KEYS.lecture, []);
    }

    async function saveLectures(arr) {
      await lifeOSSave(KEYS.lecture, arr);
    }

    async function renderLectures() {
      const list     = document.getElementById('lectureList');
      const lectures = await getLectures();

      if (lectures.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">📖</span>
            No lecture notes yet. Click "+ New Note" to start.
          </div>`;
        return;
      }

      list.innerHTML = [...lectures].reverse().map(l => `
        <div class="lecture-card" data-id="${l.id}">
          <div class="lecture-card-header" onclick="toggleLecture('${l.id}')">
            <div class="lecture-meta">
              <div class="lecture-title">${escHtml(l.title)}</div>
              <span class="lecture-subject">${escHtml(l.subject || 'General')}</span>
            </div>
            <span class="lecture-toggle">▾</span>
          </div>
          <div class="lecture-card-body">
            ${escHtml(l.body)}
            <div class="lecture-card-actions">
              <button class="btn-danger" onclick="deleteLecture('${l.id}')">Delete Note</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function toggleLecture(id) {
      const card = document.querySelector(`.lecture-card[data-id="${id}"]`);
      if (card) card.classList.toggle('expanded');
    }

    async function deleteLecture(id) {
      if (!confirm('Delete this lecture note?')) return;
      await saveLectures((await getLectures()).filter(l => l.id !== id));
      await renderLectures();
    }

    document.getElementById('openLectureModal').addEventListener('click', () => {
      document.getElementById('lectureModal').classList.add('open');
    });

    document.getElementById('cancelLectureModal').addEventListener('click', () => {
      document.getElementById('lectureModal').classList.remove('open');
    });

    document.getElementById('saveLectureBtn').addEventListener('click', async () => {
      const title   = document.getElementById('lectureTitleInput').value.trim();
      const subject = document.getElementById('lectureSubjectInput').value.trim();
      const body    = document.getElementById('lectureBodyInput').value.trim();

      if (!title || !body) {
        alert('Please fill in at least the title and note body.');
        return;
      }

      const lectures = await getLectures();
      lectures.push({ id: uid(), title, subject, body, date: new Date().toISOString() });
      await saveLectures(lectures);

      document.getElementById('lectureTitleInput').value  = '';
      document.getElementById('lectureSubjectInput').value = '';
      document.getElementById('lectureBodyInput').value   = '';
      document.getElementById('lectureModal').classList.remove('open');
      await renderLectures();
    });

    document.getElementById('lectureModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('open');
    });

    // Initial render

    // =========================================
    // SECTION 3 – IDEA VAULT
    // =========================================

    let activeFilter = 'all'; // currently selected category filter

    async function getIdeas() {
      return await lifeOSLoad(KEYS.ideas, []);
    }

    async function saveIdeas(arr) {
      await lifeOSSave(KEYS.ideas, arr);
    }

    // Maps status value → badge class
    const STATUS_BADGE = {
      raw:        'badge-raw',
      developing: 'badge-developing',
      ready:      'badge-ready',
      done:       'badge-done'
    };

    const STATUS_LABEL = {
      raw:        '🌱 Raw',
      developing: '🔧 Developing',
      ready:      '✅ Ready',
      done:       '✔ Done'
    };

    async function renderIdeas() {
      const grid  = document.getElementById('ideasGrid');
      let   ideas = await getIdeas();

      if (activeFilter !== 'all') {
        ideas = ideas.filter(i => i.category === activeFilter);
      }

      if (ideas.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <span class="empty-icon">💡</span>
            No ideas here yet. Click "+ New Idea" to capture one!
          </div>`;
        return;
      }

      grid.innerHTML = [...ideas].reverse().map(i => `
        <div class="idea-card" data-id="${i.id}">
          <div class="idea-card-header">
            <div class="idea-title">${escHtml(i.title)}</div>
          </div>
          ${i.desc ? `<div class="idea-description">${escHtml(i.desc)}</div>` : ''}
          <div class="idea-card-footer">
            <span class="badge badge-category">${escHtml(i.category)}</span>
            <span class="badge ${STATUS_BADGE[i.status] || 'badge-raw'}">${STATUS_LABEL[i.status] || i.status}</span>
            <button class="btn-danger" onclick="deleteIdea('${i.id}')">✕</button>
          </div>
        </div>
      `).join('');
    }

    async function deleteIdea(id) {
      await saveIdeas((await getIdeas()).filter(i => i.id !== id));
      await renderIdeas();
    }

    document.querySelectorAll('#ideaFilters .filter-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        document.querySelectorAll('#ideaFilters .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        await renderIdeas();
      });
    });

    document.getElementById('openIdeaModal').addEventListener('click', () => {
      document.getElementById('ideaModal').classList.add('open');
    });

    document.getElementById('cancelIdeaModal').addEventListener('click', () => {
      document.getElementById('ideaModal').classList.remove('open');
    });

    document.getElementById('saveIdeaBtn').addEventListener('click', async () => {
      const title    = document.getElementById('ideaTitleInput').value.trim();
      const desc     = document.getElementById('ideaDescInput').value.trim();
      const category = document.getElementById('ideaCategorySelect').value;
      const status   = document.getElementById('ideaStatusSelect').value;

      if (!title) {
        alert('Please enter an idea title.');
        return;
      }

      const ideas = await getIdeas();
      ideas.push({ id: uid(), title, desc, category, status, date: new Date().toISOString() });
      await saveIdeas(ideas);

      document.getElementById('ideaTitleInput').value = '';
      document.getElementById('ideaDescInput').value  = '';
      document.getElementById('ideaModal').classList.remove('open');
      await renderIdeas();
    });

    document.getElementById('ideaModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('open');
    });

    // Initial render
    // ── init ──
    (async () => {
      await window.authReady;
      await renderQuickNotes();
      await renderLectures();
      await renderIdeas();
    })();
  </script>

</body>
</html>
